.h{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.96);backdrop-filter:blur(14px);border-bottom:1px solid #222;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.mono{font-family:ui-monospace,monospace;font-size:11px;color:#888}
.wrap{max-width:1400px;margin:0 auto;width:100%}
.card{margin:8px;background:#161616;border:1px solid #262626;border-radius:14px;padding:10px;overflow:hidden}
@media(min-width:800px){.card{margin:12px;padding:14px}}
.score{font-size:20px;font-weight:900;color:#fff}
.pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #333}
.W{background:#0f1f12;color:#4ade80}.L{background:#1f1010;color:#f87171}.D{background:#1f1c0f;color:#fbbf24}
.table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:2000px}
.table.career{min-width:900px}
.table th{color:#aaa;font-size:10px;text-align:left;padding:10px 8px;border-bottom:1px solid #2a2a2a;position:sticky;top:0;background:#1a1a1a;font-weight:700;cursor:pointer;user-select:none}
.table th:hover{color:#fff;background:#252525}
.table th.sorted{color:#fff;background:#2a2a2a}
.table td{padding:9px 8px;border-bottom:1px solid #1e1e1e;font-size:12px;color:#ccc}
.tableWrap{overflow:auto;border:1px solid #262626;border-radius:12px;background:#161616;margin-top:8px;-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain}
.hidden{display:none!important}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.98);border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottom button{flex:1;background:none;border:0;font-size:10px;color:#666;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bottom button.active{color:#fff;font-weight:700}
.input{height:36px;border:1px solid #2a2a2a;border-radius:10px;padding:0 12px;width:100%;background:#1e1e1e;color:#fff;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media(max-width:1100px){.kpi{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpi{grid-template-columns:repeat(3,1fr)}}
.kpi div{border:1px solid #262626;border-radius:10px;padding:8px;background:#1e1e1e;text-align:center}
.kpi b{font-size:16px;display:block;color:#fff}
.posTag{display:inline-block;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:700}
.pos-mid{background:#1e293b;color:#93c5fd}.pos-def{background:#132a1e;color:#86efac}.pos-fwd{background:#2a1515;color:#fca5a5}.pos-gk{background:#2a2415;color:#fde68a}
.matchRow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;cursor:pointer;border-radius:10px}
.matchRow:hover{background:#1e1e1e}
.matchOpp{font-size:15px;font-weight:800;color:#fff}
.matchMeta{font-size:10px;color:#888;word-break:break-all}
.agg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:10px 0}
.agg div{background:#1e1e1e;border:1px solid #262626;border-radius:10px;padding:7px;text-align:center}
.agg b{display:block;color:#fff;font-size:12px}
.agg span{font-size:9px;color:#888}
.teamTag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px}
.my{background:#fff;color:#000}.opp{background:#2a2a2a;color:#aaa}
.zero{color:#444}
.sort-hint{font-size:9px;color:#555;margin-left:4px}
.segControl{display:flex;gap:6px;margin:10px 0 4px 0;background:#0f0f0f;border:1px solid #262626;border-radius:10px;padding:4px;width:fit-content;max-width:100%}
.segControl button{border:0;background:transparent;color:#888;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.segControl button.active{background:#fff;color:#000}
@media(max-width:800px){.segControl{width:100%}.segControl button{flex:1}}
.matchTeamPane{display:none}
.matchTeamPane.active{display:block;min-width:0}
.bothGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
@media(max-width:1200px){.bothGrid{grid-template-columns:1fr}}
.tableTitle{font-size:12px;font-weight:800;margin:8px 0 4px 0;display:flex;gap:6px;align-items:center}
@media(max-width:800px){
  .table th:first-child,.table td:first-child{position:sticky;left:0;z-index:2;background:#161616}
  .table th:first-child{z-index:3;background:#1a1a1a;min-width:110px}
  .table td:first-child{min-width:110px}
}
.badge{font-size:9px;padding:2px 6px;border-radius:6px;background:#1e1e1e;border:1px solid #333;color:#888}
.red{color:#f87171;font-weight:800}.yellow{color:#fbbf24;font-weight:800}
.pass{color:#93c5fd}
.xa{color:#a5b4fc}
.careerNote{font-size:10px;color:#666;margin-top:6px;line-height:1.4}
