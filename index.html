<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinKing FC 戰情</title>
  <meta name="description" content="LinKing FC Pro Clubs 戰績、球員榜與單場詳情。" />
  <meta name="theme-color" content="#141210" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #141210; --surface: #1e1b17; --raise: #29241e; --fg: #f3efe6;
      --muted: #a89b8c; --line: #3a322a; --gold: #e0c07a; --plum: #e7b4cf;
      --win: #b8d4a0; --loss: #e7a090; --draw: #a89b8c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans TC", system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: end; margin-bottom: 1.25rem; }
    .eyebrow { color: var(--gold); font-size: 0.85rem; letter-spacing: 0.04em; margin: 0 0 0.25rem; }
    h1 { font-family: "Barlow Condensed", "Noto Sans TC", sans-serif; font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 700; letter-spacing: 0.02em; line-height: 1; margin: 0; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; }
    button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 0.55rem 1rem; font: inherit; font-size: 0.9rem; min-height: 44px; }
    button:disabled { opacity: 0.6; cursor: default; }
    button.ghost { background: transparent; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 0.9rem 1rem; }
    .card .label { color: var(--muted); font-size: 0.8rem; margin: 0; }
    .card .value { font-family: "Barlow Condensed", sans-serif; font-size: 1.85rem; font-weight: 700; line-height: 1.1; margin: 0.15rem 0 0; }
    .card .hint { color: var(--muted); font-size: 0.8rem; margin: 0.25rem 0 0; }
    .warn { color: var(--plum); }
    .banner { border: 1px solid var(--line); background: var(--raise); color: var(--plum); border-radius: 1rem; padding: 0.75rem 1rem; font-size: 0.9rem; margin-bottom: 1rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 860px) { .grid { grid-template-columns: 1.35fr 0.9fr; align-items: start; } }
    h2 { font-size: 0.95rem; font-weight: 600; color: var(--gold); margin: 0 0 0.75rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .tabs button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    td.num, th.num { text-align: right; font-family: "Barlow Condensed", sans-serif; font-size: 1.1rem; font-weight: 600; }
    .match { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; padding: 0.65rem 0.4rem; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 0.5rem; width: 100%; text-align: left; background: transparent; color: inherit; font: inherit; min-height: auto; border-left: 0; border-right: 0; border-top: 0; }
    .match:hover, .match:focus-visible { background: var(--raise); outline: none; }
    .match.active { background: var(--raise); box-shadow: inset 3px 0 0 var(--gold); }
    .match .meta { color: var(--muted); font-size: 0.8rem; }
    .match .score { font-family: "Barlow Condensed", sans-serif; font-size: 1.6rem; font-weight: 700; white-space: nowrap; }
    .pill { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid var(--line); margin-right: 0.35rem; }
    .pill.win { color: var(--win); } .pill.loss { color: var(--loss); } .pill.draw { color: var(--draw); }
    .err { background: var(--raise); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; color: var(--plum); }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; } footer a { color: var(--fg); }
    .hero-score { font-family: "Barlow Condensed", sans-serif; font-size: 3rem; font-weight: 700; line-height: 1; margin: 0.4rem 0; }
    #detail[hidden] { display: none !important; }
    .detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem; align-items: start; margin-bottom: 1rem; }
    .player-block { border: 1px solid var(--line); border-radius: 0.85rem; padding: 0.85rem; margin-bottom: 0.75rem; background: var(--raise); }
    .player-block h3 { margin: 0 0 0.35rem; font-size: 1.05rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
    .player-block .rating { font-family: "Barlow Condensed", sans-serif; font-size: 1.5rem; color: var(--gold); font-weight: 700; }
    .stat-row { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; font-size: 0.85rem; margin: 0.35rem 0; }
    .stat-row span b { color: var(--muted); font-weight: 500; margin-right: 0.2rem; }
    .section-label { color: var(--gold); font-size: 0.78rem; margin: 0.5rem 0 0.2rem; letter-spacing: 0.03em; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip { font-size: 0.78rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.55rem; background: var(--surface); }
    .chip strong { font-family: "Barlow Condensed", sans-serif; font-size: 1rem; margin-left: 0.15rem; }
    .hint-click { color: var(--muted); font-size: 0.8rem; margin: 0 0 0.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">FC 26 · Pro Clubs · 41026</p>
        <h1>LinKing FC</h1>
        <p class="sub">戰情頁 · GitHub JSON · 可點戰報看單場詳情</p>
      </div>
      <button type="button" id="btn-reload">重新讀取</button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div id="stats" class="stats"></div>
    <div id="error" class="err" hidden></div>
    <section id="detail" class="card" hidden style="margin-bottom:1rem">
      <div class="detail-head">
        <div>
          <h2 style="margin:0">單場詳情</h2>
          <p id="detail-title" class="sub" style="margin-top:0.35rem"></p>
        </div>
        <button type="button" class="ghost" id="btn-close-detail">關閉</button>
      </div>
      <div id="detail-body"></div>
    </section>
    <div class="grid">
      <section class="card">
        <h2>球員榜</h2>
        <div class="tabs" id="board-tabs">
          <button type="button" data-sort="attack" class="active">進攻</button>
          <button type="button" data-sort="defense">防守</button>
          <button type="button" data-sort="rating">評分</button>
          <button type="button" data-sort="pass">傳球</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>#</th><th>球員</th><th class="num">場</th><th class="num" id="col-metric">G+A</th><th class="num">評分</th></tr></thead>
            <tbody id="board-body"></tbody>
          </table>
        </div>
      </section>
      <div style="display:flex;flex-direction:column;gap:1rem">
        <section class="card"><h2>最近一場</h2><div id="last-match"></div></section>
        <section class="card"><h2>戰報</h2><p class="hint-click">點一場可看每位球員詳細數據</p><div id="matches"></div></section>
      </div>
    </div>
    <footer>
      資料來源 <a href="https://github.com/siumeifc1988-sketch/linking-fc-sync">linking-fc-sync</a>
      · event 解碼參考 <a href="https://github.com/1erkandogan/fc27-clubs-api/blob/main/docs/match-events.md">fc27-clubs-api match-events</a>
      · xG 為估算
    </footer>
  </div>
  <script>
    const CLUB = "41026";
    const TYPE = { leagueMatch: "聯賽", playoffMatch: "季後賽", friendlyMatch: "友誼賽" };
    const POS = { forward: "前鋒", midfielder: "中場", defender: "後衛", goalkeeper: "門將" };
    const EV = {
      215: "成功傳球", 216: "失敗傳球", 30: "向前傳", 32: "向後傳", 34: "橫傳",
      24: "短傳", 26: "中傳", 28: "長傳", 36: "傳中成功", 152: "直塞成功", 153: "傳球越位", 143: "一腳出球",
      217: "射正", 218: "射偏", 13: "禁區內射正", 14: "禁區內射偏", 18: "禁區外射正", 19: "禁區外射偏",
      214: "入球(事件)", 11: "助攻(事件)", 174: "盤球成功", 97: "帶球推進",
      0: "搶截成功", 1: "搶截失敗", 6: "攔截", 156: "封堵傳中", 265: "進攻頭錘勝", 266: "防守頭錘勝",
      111: "站位好", 219: "站位差", 105: "後場失球權", 106: "中場失球權", 107: "前場失球權",
      108: "後場奪回", 109: "中場奪回", 110: "前場奪回"
    };
    let board = null, matches = [], sortMode = "attack", selectedId = null;
    function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
    function whenHK(ts) {
      if (!ts) return "-";
      return new Intl.DateTimeFormat("zh-HK", { timeZone: "Asia/Hong_Kong", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ts * 1000));
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&" + "amp;").replace(/</g, "&" + "lt;").replace(/>/g, "&" + "gt;").replace(/"/g, "&" + "quot;");
    }
    function decodeEvents(p) {
      const out = {};
      for (let i = 0; i < 4; i++) {
        const s = p["match_event_aggregate_" + i] || "";
        if (!s) continue;
        String(s).split(",").forEach(function (part) {
          const kv = part.split(":");
          if (kv.length !== 2) return;
          const id = parseInt(kv[0], 10), c = parseFloat(kv[1]);
          if (!isNaN(id) && !isNaN(c)) out[id] = c;
        });
      }
      return out;
    }
    function shapeMatches(raw) {
      return (raw || []).map(function (m) {
        const clubs = m.clubs || {}, us = clubs[CLUB];
        if (!us) return null;
        const oppId = Object.keys(clubs).find(function (id) { return id !== CLUB; });
        const opp = oppId ? clubs[oppId] : null;
        const gf = num(us.goals), ga = num(us.goalsAgainst);
        const outcome = gf > ga ? "勝" : gf < ga ? "負" : "和";
        return {
          id: String(m.matchId || m.timestamp), type: TYPE[m._matchType] || "比賽",
          when: whenHK(num(m.timestamp)), ts: num(m.timestamp), us: gf, them: ga,
          opp: (opp && opp.details && opp.details.name) || "對手", outcome: outcome,
          dnf: num(us.winnerByDnf) > 0 || (opp && num(opp.winnerByDnf) > 0), raw: m
        };
      }).filter(Boolean).sort(function (a, b) { return b.ts - a.ts; });
    }
    function recordOf(rows) {
      return rows.reduce(function (a, r) {
        if (r.outcome === "勝") a.w += 1; else if (r.outcome === "和") a.d += 1; else a.l += 1;
        a.gf += r.us; a.ga += r.them; return a;
      }, { w: 0, d: 0, l: 0, gf: 0, ga: 0 });
    }
    function formLine(rows, n) { n = n || 5; return rows.slice(0, n).map(function (r) { return r.outcome; }).join(" ") || "-"; }
    function sortPlayers(list, mode) {
      const rows = (list || []).slice();
      if (mode === "defense") rows.sort(function (a, b) { return b.totalDef - a.totalDef || b.avgRating - a.avgRating; });
      else if (mode === "rating") rows.sort(function (a, b) { return b.avgRating - a.avgRating || b.games - a.games; });
      else if (mode === "pass") rows.sort(function (a, b) { return b.passPct - a.passPct || b.keyPass - a.keyPass; });
      else rows.sort(function (a, b) { return b.goals + b.assists - (a.goals + a.assists) || b.goals - a.goals; });
      return rows;
    }
    function metric(p, mode) {
      if (mode === "defense") return p.totalDef;
      if (mode === "rating") return Number(p.avgRating).toFixed(2);
      if (mode === "pass") return p.passPct + "%";
      return p.goals + "+" + p.assists;
    }
    function pillClass(o) { return o === "勝" ? "win" : o === "負" ? "loss" : "draw"; }
    function chipsFromEvents(ev, ids) {
      return ids.filter(function (id) { return num(ev[id]) > 0; }).map(function (id) {
        return '<span class="chip">' + escapeHtml(EV[id] || ("E" + id)) + "<strong>" + num(ev[id]) + "</strong></span>";
      }).join("");
    }
    function playerDetailHtml(p) {
      const name = p.playername || p.name || "Unknown";
      const pos = POS[String(p.pos || "").toLowerCase()] || p.pos || "";
      const rating = num(p.rating).toFixed(2);
      const ev = decodeEvents(p);
      const goals = num(p.goals), assists = num(p.assists), shots = num(p.shots);
      const pm = num(p.passesmade || p.passesMade), pa = num(p.passattempts || p.passAttempts);
      const tkM = num(p.tacklesmade || p.tacklesMade), tkA = num(p.tackleattempts);
      const secs = num(p.secondsPlayed || p.gameTime), mins = secs ? Math.round(secs / 60) : 0;
      const passIds = [215, 216, 30, 32, 34, 24, 26, 28, 36, 152, 153, 143];
      const shotIds = [217, 218, 13, 14, 18, 19, 214, 11];
      const defIds = [0, 1, 6, 156, 265, 266];
      const otherIds = [174, 97, 111, 219, 105, 106, 107, 108, 109, 110];
      return '<div class="player-block"><h3>' + escapeHtml(name) +
        (pos ? ' <span style="color:var(--muted);font-size:0.85rem;font-weight:500">' + escapeHtml(pos) + "</span>" : "") +
        ' <span class="rating">' + rating + "</span></h3>" +
        '<div class="stat-row"><span><b>入球</b>' + goals + "</span><span><b>助攻</b>" + assists +
        "</span><span><b>射門</b>" + shots + "</span><span><b>傳球</b>" + pm + "/" + pa +
        "</span><span><b>搶截</b>" + tkM + "/" + tkA + "</span>" +
        (mins ? "<span><b>上場</b>" + mins + " 分</span>" : "") + "</div>" +
        '<p class="section-label">傳球（事件解碼）</p><div class="chips">' + (chipsFromEvents(ev, passIds) || '<span class="chip">無</span>') + "</div>" +
        '<p class="section-label">射門 / 入球</p><div class="chips">' + (chipsFromEvents(ev, shotIds) || '<span class="chip">無</span>') + "</div>" +
        '<p class="section-label">防守</p><div class="chips">' + (chipsFromEvents(ev, defIds) || '<span class="chip">無</span>') + "</div>" +
        '<p class="section-label">盤帶 / 站位 / 球權</p><div class="chips">' + (chipsFromEvents(ev, otherIds) || '<span class="chip">無</span>') + "</div></div>";
    }
    function openDetail(matchRow) {
      selectedId = matchRow.id;
      const detail = document.getElementById("detail");
      detail.hidden = false;
      document.getElementById("detail-title").textContent =
        matchRow.type + " · " + matchRow.when + " · " + matchRow.us + "-" + matchRow.them + " vs " + matchRow.opp +
        (matchRow.dnf ? " · 有人離線" : "");
      const raw = matchRow.raw || {};
      const playersMap = (raw.players && raw.players[CLUB]) || {};
      let list = Array.isArray(playersMap) ? playersMap : Object.keys(playersMap).map(function (k) { return playersMap[k]; });
      list.sort(function (a, b) { return num(b.rating) - num(a.rating); });
      const body = document.getElementById("detail-body");
      if (!list.length) body.innerHTML = "<p class='meta'>這場沒有球員細項</p>";
      else body.innerHTML = '<p class="hint-click">共 ' + list.length + " 人 · 具名欄位以 EA 為準 · 下方事件依研究文件解碼</p>" + list.map(playerDetailHtml).join("");
      renderMatchList();
      detail.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function closeDetail() { selectedId = null; document.getElementById("detail").hidden = true; renderMatchList(); }
    function renderMatchList() {
      document.getElementById("matches").innerHTML = matches.slice(0, 12).map(function (r) {
        return '<button type="button" class="match' + (r.id === selectedId ? " active" : "") + '" data-id="' + escapeHtml(r.id) + '">' +
          "<div><div><span class=\"pill " + pillClass(r.outcome) + '">' + r.outcome + "</span>" + escapeHtml(r.opp) +
          '</div><div class="meta">' + r.type + " · " + r.when + (r.dnf ? " · 離線" : "") + "</div></div>" +
          '<div class="score">' + r.us + "-" + r.them + "</div></button>";
      }).join("") || "<p class='meta'>沒有比賽</p>";
    }
    function render() {
      const rec = recordOf(matches);
      const counts = (board && board.lastFetchCounts) || {};
      const stale = board && (String(board.lastStatus || "").indexOf("舊") >= 0 || num(counts.league) + num(counts.friendly) + num(counts.playoff) === 0);
      document.getElementById("stats").innerHTML =
        '<div class="card"><p class="label">視窗戰績</p><p class="value">' + rec.w + "-" + rec.d + "-" + rec.l +
        '</p><p class="hint">' + rec.gf + " 入 · " + rec.ga + " 失</p></div>" +
        '<div class="card"><p class="label">近況</p><p class="value">' + formLine(matches) + '</p><p class="hint">由新到舊</p></div>' +
        '<div class="card"><p class="label">場次</p><p class="value">' + (board ? board.totalMatches : matches.length) +
        '</p><p class="hint">聯賽 ' + num(counts.league) + " · 季後 " + num(counts.playoff) + " · 友誼 " + num(counts.friendly) + "</p></div>" +
        '<div class="card"><p class="label">檔頭狀態</p><p class="value ' + (stale ? "warn" : "") + '">' +
        ((board && board.lastStatus) || "-") + '</p><p class="hint">' + ((board && board.lastUpdatedDisplay) || "") + "</p></div>";
      const banner = document.getElementById("banner");
      if (stale) { banner.hidden = false; banner.textContent = "檔頭寫「" + board.lastStatus + "」，代表最近一次抓取可能是 0 場；頁面上的比賽仍來自目前 JSON 視窗。"; }
      else banner.hidden = true;
      document.getElementById("col-metric").textContent = sortMode === "defense" ? "防守" : sortMode === "rating" ? "評分" : sortMode === "pass" ? "傳球%" : "G+A";
      document.getElementById("board-body").innerHTML = sortPlayers(board ? board.players : [], sortMode).map(function (p, i) {
        return "<tr><td>" + (i + 1) + "</td><td><strong>" + escapeHtml(p.name) +
          '</strong><div style="color:var(--muted);font-size:0.8rem">' + escapeHtml(p.posCN) +
          '</div></td><td class="num">' + p.games + '</td><td class="num">' + metric(p, sortMode) +
          '</td><td class="num">' + Number(p.avgRating).toFixed(2) + "</td></tr>";
      }).join("");
      const last = matches[0], lastEl = document.getElementById("last-match");
      if (!last) lastEl.innerHTML = "<p class='meta'>沒有比賽</p>";
      else lastEl.innerHTML = '<button type="button" class="match" data-id="' + escapeHtml(last.id) + '" style="border:0;padding:0">' +
        '<div style="text-align:left"><p class="meta" style="margin:0">' + last.type + " · " + last.when + (last.dnf ? " · 有人離線" : "") +
        '</p><p class="hero-score" style="margin:0.35rem 0">' + last.us + '<span style="color:var(--muted)">-</span>' + last.them +
        '</p><p style="margin:0"><span class="pill ' + pillClass(last.outcome) + '">' + last.outcome +
        "</span> vs " + escapeHtml(last.opp) + "</p><p class='hint-click' style='margin:0.4rem 0 0'>點此看單場詳情</p></div></button>";
      renderMatchList();
    }
    async function load() {
      const err = document.getElementById("error");
      err.hidden = true;
      document.getElementById("btn-reload").disabled = true;
      try {
        const bust = "?t=" + Date.now();
        const results = await Promise.all([
          fetch("./data/aggregated/board.json" + bust, { cache: "no-store" }),
          fetch("./data/matches.json" + bust, { cache: "no-store" })
        ]);
        if (!results[0].ok || !results[1].ok) throw new Error("讀不到 data JSON（HTTP " + results[0].status + "/" + results[1].status + "）");
        board = await results[0].json();
        matches = shapeMatches(await results[1].json());
        render();
      } catch (e) { err.hidden = false; err.textContent = e.message || String(e); }
      finally { document.getElementById("btn-reload").disabled = false; }
    }
    document.getElementById("btn-reload").addEventListener("click", load);
    document.getElementById("btn-close-detail").addEventListener("click", closeDetail);
    document.getElementById("board-tabs").addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-sort]");
      if (!btn) return;
      sortMode = btn.dataset.sort;
      document.querySelectorAll("#board-tabs button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      render();
    });
    document.getElementById("matches").addEventListener("click", function (e) {
      const btn = e.target.closest("button.match[data-id]");
      if (!btn) return;
      const row = matches.find(function (m) { return m.id === btn.dataset.id; });
      if (row) openDetail(row);
    });
    document.getElementById("last-match").addEventListener("click", function (e) {
      const btn = e.target.closest("button.match[data-id]");
      if (!btn) return;
      const row = matches.find(function (m) { return m.id === btn.dataset.id; });
      if (row) openDetail(row);
    });
    load();
  </script>
