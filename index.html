<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinKing FC 戰情</title>
  <meta name="description" content="LinKing FC Pro Clubs 戰績與球員榜。資料來自 GitHub 同步。" />
  <meta name="theme-color" content="#141210" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #141210;
      --surface: #1e1b17;
      --raise: #29241e;
      --fg: #f3efe6;
      --muted: #a89b8c;
      --line: #3a322a;
      --gold: #e0c07a;
      --plum: #e7b4cf;
      --win: #b8d4a0;
      --loss: #e7a090;
      --draw: #a89b8c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: end; margin-bottom: 1.25rem; }
    .eyebrow { color: var(--gold); font-size: 0.85rem; letter-spacing: 0.04em; margin: 0 0 0.25rem; }
    h1 {
      font-family: "Barlow Condensed", "Noto Sans TC", sans-serif;
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      margin: 0;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.9rem;
      min-height: 44px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.9rem 1rem;
    }
    .card .label { color: var(--muted); font-size: 0.8rem; margin: 0; }
    .card .value {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.1;
      margin: 0.15rem 0 0;
    }
    .card .hint { color: var(--muted); font-size: 0.8rem; margin: 0.25rem 0 0; }
    .warn { color: var(--plum); }
    .banner {
      border: 1px solid var(--line);
      background: var(--raise);
      color: var(--plum);
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 860px) {
      .grid { grid-template-columns: 1.35fr 0.9fr; align-items: start; }
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--gold);
      margin: 0 0 0.75rem;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .tabs button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    td.num, th.num {
      text-align: right;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .match {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--line);
    }
    .match:last-child { border-bottom: 0; }
    .match .meta { color: var(--muted); font-size: 0.8rem; }
    .match .score {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      margin-right: 0.35rem;
    }
    .pill.win { color: var(--win); border-color: color-mix(in srgb, var(--win) 40%, var(--line)); }
    .pill.loss { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, var(--line)); }
    .pill.draw { color: var(--draw); }
    .err {
      background: var(--raise);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1rem;
      color: var(--plum);
    }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--fg); }
    .hero-score {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      margin: 0.4rem 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">FC 26 · Pro Clubs · 41026</p>
        <h1>LinKing FC</h1>
        <p class="sub">戰情頁 · 資料直接讀 GitHub JSON（非 Firebase）</p>
      </div>
      <button type="button" id="btn-reload">重新讀取</button>
    </header>

    <div id="banner" class="banner" hidden></div>
    <div id="stats" class="stats"></div>
    <div id="error" class="err" hidden></div>

    <div class="grid">
      <section class="card">
        <h2>球員榜</h2>
        <div class="tabs" id="board-tabs">
          <button type="button" data-sort="attack" class="active">進攻</button>
          <button type="button" data-sort="defense">防守</button>
          <button type="button" data-sort="rating">評分</button>
          <button type="button" data-sort="pass">傳球</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>球員</th>
                <th class="num">場</th>
                <th class="num" id="col-metric">G+A</th>
                <th class="num">評分</th>
              </tr>
            </thead>
            <tbody id="board-body"></tbody>
          </table>
        </div>
      </section>

      <div style="display:flex;flex-direction:column;gap:1rem">
        <section class="card">
          <h2>最近一場</h2>
          <div id="last-match"></div>
        </section>
        <section class="card">
          <h2>戰報</h2>
          <div id="matches"></div>
        </section>
      </div>
    </div>

    <footer>
      資料來源
      <a href="https://github.com/siumeifc1988-sketch/linking-fc-sync">siumeifc1988-sketch/linking-fc-sync</a>
      · 同步腳本 <code>scripts/sync.py</code>
      · xG / xA 為估算，榜為最近抓取視窗
    </footer>
  </div>

  <script>
    const CLUB = "41026";
    const TYPE = { leagueMatch: "聯賽", playoffMatch: "季後賽", friendlyMatch: "友誼賽" };
    let board = null;
    let matches = [];
    let sortMode = "attack";

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function whenHK(ts) {
      if (!ts) return "—";
      return new Intl.DateTimeFormat("zh-HK", {
        timeZone: "Asia/Hong_Kong",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      }).format(new Date(ts * 1000));
    }

    function shapeMatches(raw) {
      return (raw || [])
        .map((m) => {
          const clubs = m.clubs || {};
          const us = clubs[CLUB];
          if (!us) return null;
          const oppId = Object.keys(clubs).find((id) => id !== CLUB);
          const opp = oppId ? clubs[oppId] : null;
          const gf = num(us.goals);
          const ga = num(us.goalsAgainst);
          const outcome = gf > ga ? "勝" : gf < ga ? "負" : "和";
          return {
            id: String(m.matchId || m.timestamp),
            type: TYPE[m._matchType] || "比賽",
            when: whenHK(num(m.timestamp)),
            ts: num(m.timestamp),
            us: gf,
            them: ga,
            opp: (opp && opp.details && opp.details.name) || "對手",
            outcome,
            dnf: num(us.winnerByDnf) > 0 || (opp && num(opp.winnerByDnf) > 0),
          };
        })
        .filter(Boolean)
        .sort((a, b) => b.ts - a.ts);
    }

    function recordOf(rows) {
      return rows.reduce(
        (a, r) => {
          if (r.outcome === "勝") a.w += 1;
          else if (r.outcome === "和") a.d += 1;
          else a.l += 1;
          a.gf += r.us;
          a.ga += r.them;
          return a;
        },
        { w: 0, d: 0, l: 0, gf: 0, ga: 0 }
      );
    }

    function formLine(rows, n = 5) {
      return rows.slice(0, n).map((r) => r.outcome).join(" ") || "—";
    }

    function sortPlayers(list, mode) {
      const rows = [...(list || [])];
      if (mode === "defense") rows.sort((a, b) => b.totalDef - a.totalDef || b.avgRating - a.avgRating);
      else if (mode === "rating") rows.sort((a, b) => b.avgRating - a.avgRating || b.games - a.games);
      else if (mode === "pass") rows.sort((a, b) => b.passPct - a.passPct || b.keyPass - a.keyPass);
      else rows.sort((a, b) => b.goals + b.assists - (a.goals + a.assists) || b.goals - a.goals);
      return rows;
    }

    function metric(p, mode) {
      if (mode === "defense") return p.totalDef;
      if (mode === "rating") return Number(p.avgRating).toFixed(2);
      if (mode === "pass") return p.passPct + "%";
      return p.goals + "+" + p.assists;
    }

    function render() {
      const rec = recordOf(matches);
      const counts = (board && board.lastFetchCounts) || {};
      const stale =
        board &&
        (String(board.lastStatus || "").includes("舊") ||
          num(counts.league) + num(counts.friendly) + num(counts.playoff) === 0);

      document.getElementById("stats").innerHTML = `
        <div class="card"><p class="label">視窗戰績</p><p class="value">${rec.w}-${rec.d}-${rec.l}</p><p class="hint">${rec.gf} 入 · ${rec.ga} 失</p></div>
        <div class="card"><p class="label">近況</p><p class="value">${formLine(matches)}</p><p class="hint">由新到舊</p></div>
        <div class="card"><p class="label">場次</p><p class="value">${board ? board.totalMatches : matches.length}</p><p class="hint">聯賽 ${num(counts.league)} · 季後 ${num(counts.playoff)} · 友誼 ${num(counts.friendly)}</p></div>
        <div class="card"><p class="label">檔頭狀態</p><p class="value ${stale ? "warn" : ""}">${(board && board.lastStatus) || "—"}</p><p class="hint">${(board && board.lastUpdatedDisplay) || ""}</p></div>
      `;

      const banner = document.getElementById("banner");
      if (stale) {
        banner.hidden = false;
        banner.textContent =
          "檔頭寫「" +
          board.lastStatus +
          "」，代表最近一次抓取可能是 0 場；頁面上的比賽仍來自目前 JSON 視窗。";
      } else {
        banner.hidden = true;
      }

      const metricLabel =
        sortMode === "defense" ? "防守" : sortMode === "rating" ? "評分" : sortMode === "pass" ? "傳球%" : "G+A";
      document.getElementById("col-metric").textContent = metricLabel;
      const sorted = sortPlayers(board ? board.players : [], sortMode);
      document.getElementById("board-body").innerHTML = sorted
        .map(
          (p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${escapeHtml(p.name)}</strong><div style="color:var(--muted);font-size:0.8rem">${escapeHtml(p.posCN)}</div></td>
          <td class="num">${p.games}</td>
          <td class="num">${metric(p, sortMode)}</td>
          <td class="num">${Number(p.avgRating).toFixed(2)}</td>
        </tr>`
        )
        .join("");

      const last = matches[0];
      const lastEl = document.getElementById("last-match");
      if (!last) {
        lastEl.innerHTML = "<p class='meta'>沒有比賽</p>";
      } else {
        lastEl.innerHTML = `
          <p class="meta">${last.type} · ${last.when}${last.dnf ? " · 有人離線" : ""}</p>
          <p class="hero-score">${last.us}<span style="color:var(--muted)">-</span>${last.them}</p>
          <p><span class="pill ${last.outcome === "勝" ? "win" : last.outcome === "負" ? "loss" : "draw"}">${last.outcome}</span>
          vs ${escapeHtml(last.opp)}</p>`;
      }

      document.getElementById("matches").innerHTML = matches
        .slice(0, 12)
        .map(
          (r) => `
        <div class="match">
          <div>
            <div><span class="pill ${r.outcome === "勝" ? "win" : r.outcome === "負" ? "loss" : "draw"}">${r.outcome}</span>${escapeHtml(r.opp)}</div>
            <div class="meta">${r.type} · ${r.when}${r.dnf ? " · 離線" : ""}</div>
          </div>
          <div class="score">${r.us}-${r.them}</div>
        </div>`
        )
        .join("") || "<p class='meta'>沒有比賽</p>";
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """);
    }

    async function load() {
      const err = document.getElementById("error");
      err.hidden = true;
      document.getElementById("btn-reload").disabled = true;
      try {
        const bust = "?t=" + Date.now();
        const [bRes, mRes] = await Promise.all([
          fetch("./data/aggregated/board.json" + bust, { cache: "no-store" }),
          fetch("./data/matches.json" + bust, { cache: "no-store" }),
        ]);
        if (!bRes.ok || !mRes.ok) throw new Error("讀不到 data JSON（HTTP " + bRes.status + "/" + mRes.status + "）");
        board = await bRes.json();
        matches = shapeMatches(await mRes.json());
        render();
      } catch (e) {
        err.hidden = false;
        err.textContent = e.message || String(e);
      } finally {
        document.getElementById("btn-reload").disabled = false;
      }
    }

    document.getElementById("btn-reload").addEventListener("click", load);
    document.getElementById("board-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-sort]");
      if (!btn) return;
      sortMode = btn.dataset.sort;
      document.querySelectorAll("#board-tabs button").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });

    load();
  </script>
</body>
</html>
