<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinKing FC 41026</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f5fa;color:#111;font-size:14px}
.h{position:sticky;top:0;background:#fff;border-bottom:1px solid #e8eaf0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:12px;margin:12px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.kpi div{border:1px solid #e8eaf0;border-radius:12px;padding:10px;background:#fcfcff}
.kpi b{font-size:18px;display:block}
.mono{font-family:monospace;font-size:11px;color:#7a7f94}
.pill{display:inline-flex;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid #e8eaf0}
.W{background:#ecfdf5;color:#16a34a}.L{background:#fef2f2;color:#dc2626}.D{background:#fffbeb;color:#ca8a04}
.table{width:100%;border-collapse:collapse}.table th{font-size:11px;color:#7a7f94;text-align:left;padding:8px;border-bottom:1px solid #e8eaf0}.table td{padding:8px;border-bottom:1px solid #f1f2f6;font-size:13px}
.btn{height:28px;padding:0 10px;border-radius:999px;border:1px solid #e8eaf0;background:#fff;font-size:12px}
</style>
</head>
<body>
<div class="h"><div><b>LinKing FC 41026</b><div class="mono" id="st">只讀 football-signup-64bd9/matches</div></div><span class="mono">Firebase</span></div>
<div class="card"><div id="kpi" class="kpi"></div><div id="extra" class="mono"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><b>賽程</b><span class="mono" id="cnt"></span></div><table class="table" id="mt"><thead><tr><th>日期</th><th>對手</th><th>比分</th><th>賽果</th><th>操作</th></tr></thead><tbody></tbody></table></div>
<div class="card"><b>球員</b><div id="plist" class="mono"></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyC3UOT0RyPs6ELCzZOEUXAWn9ysp_-Tw70",
  authDomain: "football-signup-64bd9.firebaseapp.com",
  projectId: "football-signup-64bd9",
  storageBucket: "football-signup-64bd9.firebasestorage.app",
  messagingSenderId: "133898606488",
  appId: "1:133898606488:web:fc2f0ce732a26de9157ded"
};
const CLUB_ID='41026';
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let ALL=[];
function parse(d){
 let ts=Number(d.timestamp||0); if(ts>1e12) ts=Math.floor(ts/1000);
 let clubs=d.clubs||{}; let my=clubs[CLUB_ID]||Object.values(clubs).find(c=>c.details?.name==='LinKing FC')||{};
 let otherKey=Object.keys(clubs).find(k=>k!==CLUB_ID)||''; let other=clubs[otherKey]||{};
 let sf=parseInt(my.goals||0,10), sa=parseInt(my.goalsAgainst||0,10);
 let opp=other.details?.name||'對手';
 let res=sf>sa?'W':sf<sa?'L':'D';
 let players=(d.players||{})[CLUB_ID]||{};
 let list=Object.values(players).map(p=>`${p.playername||p.name}:${p.goals||0}球`).join(' | ');
 return {ts,sf,sa,opp,res,list,raw:d};
}
async function load(){
 const q=query(collection(db,'matches'), orderBy('timestamp','desc'), limit(200));
 const snap=await getDocs(q);
 let arr=[]; snap.forEach(doc=>{ arr.push(parse(doc.data())); });
 ALL=arr.filter(x=>x.ts>0).sort((a,b)=>b.ts-a.ts);
 document.getElementById('st').textContent=`Firebase 已載入 ${ALL.length}場 · football-signup-64bd9/matches`;
 const w=ALL.filter(m=>m.res==='W').length,d=ALL.filter(m=>m.res==='D').length,l=ALL.filter(m=>m.res==='L').length;
 const gf=ALL.reduce((s,m)=>s+m.sf,0),ga=ALL.reduce((s,m)=>s+m.sa,0);
 document.getElementById('kpi').innerHTML=`<div><b>${w}</b><span>勝</span></div><div><b>${d}</b><span>和</span></div><div><b>${l}</b><span>負</span></div><div><b>${gf}-${ga}</b><span>得失</span></div>`;
 document.getElementById('cnt').textContent=`${ALL.length}場`;
 document.getElementById('extra').textContent=`總 ${ALL.length}場 · 勝率 ${ALL.length?Math.round(w/ALL.length*100):0}%`;
 const tb=document.querySelector('#mt tbody'); tb.innerHTML='';
 ALL.forEach(m=>{
  const tr=document.createElement('tr');
  const date=new Date(m.ts*1000); const fmt=`${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
  tr.innerHTML=`<td>${fmt}<div class="mono">DATE ${m.ts}</div></td><td><b>${m.opp}</b></td><td><b>${m.sf}-${m.sa}</b></td><td><span class="pill ${m.res}">${m.res}</span></td><td><button class="btn" onclick="alert('${m.list.replace(/'/g,"")}')">球員</button></td>`;
  tb.appendChild(tr);
 });
 const map={};
 ALL.forEach(m=>{
  const players=(m.raw.players||{})[CLUB_ID]||{};
  Object.values(players).forEach(p=>{
   const n=p.playername||p.name||'Unknown';
   if(!map[n]) map[n]={name:n,g:0,a:0,ga:0};
   map[n].g+=Number(p.goals||0);
   map[n].a+=Number(p.assists||0);
   map[n].ga++;
  });
 });
 const plist=Object.values(map).sort((a,b)=>b.g-a.g).slice(0,20);
 document.getElementById('plist').innerHTML=plist.map(p=>`${p.name} ${p.g}球 ${p.a}助 ${p.ga}場`).join('<br>');
}
load();
</script>
</body>
</html>
