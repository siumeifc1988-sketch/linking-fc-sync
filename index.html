<script>
const CLUB_ID="41026";
// 先讀相對路徑，再 fallback 絕對路徑
const URLS=["./data/matches.json","./data/matches.json?t="+Date.now(),"https://siumeifc1988-sketch.github.io/linking-fc-sync/data/matches.json","https://raw.githubusercontent.com/siumeifc1988-sketch/linking-fc-sync/main/data/matches.json"];

function gv(o,keys){
  if(!o) return 0;
  for(const k of keys){
    if(o[k]!=null) return Number(o[k])||0;
    // 大細楷兼容
    const found = Object.keys(o).find(x=>x.toLowerCase()===k.toLowerCase());
    if(found && o[found]!=null) return Number(o[found])||0;
  }
  return 0;
}
function findClub(m){
  const clubs=m.clubs||{};
  const keys=Object.keys(clubs);
  if(!keys.length) return {us:null,them:null};
  let usKey = keys.find(k=>k==CLUB_ID) || keys[0];
  let themKey = keys.find(k=>k!=usKey) || keys[1];
  return {us:clubs[usKey], them: themKey?clubs[themKey]:null};
}
function parse(raw){
  const list=Array.isArray(raw)?raw:(raw.matches||raw.data||[]);
  console.log('parse raw', list.length);
  return list.map((m,i)=>{
    const {us,them}=findClub(m);
    if(!us) return null;
    const gf=gv(us,["goals","score"]);
    const ga=them?gv(them,["goals","score"]):gv(us,["goalsAgainst"]);
    let r="D"; if(gf>ga) r="W"; else if(gf<ga) r="L";
    const ts = m.timestamp? m.timestamp*1000 : (Date.now()-i*86400000);
    const date = new Date(ts).toLocaleDateString("zh-HK",{month:"short",day:"numeric"});
    // EA matches API 本身無 players，要靠另外 API，冇就當空
    const players = us.players||us.members||m.players||[];
    const opp = them? (them.details?.name || them.clubName || them.name || "對手") : "對手";
    return {id:String(m.matchId||i),date,ts,gf,ga,result:r,poss:gv(us,["possession","possessionPct"])||50,opp,players:Array.isArray(players)?players:Object.values(players)};
  }).filter(Boolean);
}

let allMatches=[];
let playersMap=new Map();

async function load(){
  let ok=false;
  for(const url of URLS){
    try{
      console.log('try fetch',url);
      const r=await fetch(url,{cache:"no-store"});
      console.log(url, r.status);
      if(!r.ok) continue;
      const j=await r.json();
      allMatches=parse(j);
      if(allMatches.length){ ok=true; break; }
    }catch(e){ console.warn('fetch fail',url,e); }
  }
  if(!ok){
    document.getElementById("lastUpdate").textContent="讀唔到 data/matches.json，請檢查 Pages 是否已部署";
    document.getElementById("tab-players").innerHTML="<div class='card'>讀唔到數據，打開 Console 睇 log。直接開 /data/matches.json 試下有無 200</div>";
    return;
  }
  render();
}
// 後面 renderKPIs, renderPlayers, renderMatches, renderOverview 保留你原本，唔使改
</script>
