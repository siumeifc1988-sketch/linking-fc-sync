function posCN(pos){ if(!pos) return '未知'; pos=String(pos).toLowerCase(); if(pos.includes('goal')) return '門將'; if(pos.includes('def')) return '後衛'; if(pos.includes('mid')) return '中場'; if(pos.includes('for')||pos.includes('striker')||pos.includes('wing')||pos.includes('forward')) return '前鋒'; return pos; }

function parseDoc(d){ let ts=Number(d.timestamp||0); if(ts>1e12) ts=Math.floor(ts/1000); if(!ts||isNaN(ts)) return null; let clubs=d.clubs||{}; let my=clubs[CLUB_ID]||Object.values(clubs).find(c=>c.details?.name==='LinKing FC')||{}; let otherKey=Object.keys(clubs).find(k=>k!==CLUB_ID)||''; let other=clubs[otherKey]||{}; let sf=parseInt(my.goals||0),sa=parseInt(my.goalsAgainst||0); if(isNaN(sf)) sf=0; if(isNaN(sa)) sa=0; let opp=other.details?.name||'對手'; let res=sf>sa?'W':sf<sa?'L':'D'; let players=d.players||{}; let myRaw=players[CLUB_ID]||{}; let oppRaw=players[otherKey]||{}; if(Array.isArray(myRaw)) myRaw=Object.fromEntries(myRaw.map((p,i)=>[p.playerId||i,p])); if(Array.isArray(oppRaw)) oppRaw=Object.fromEntries(oppRaw.map((p,i)=>[p.playerId||i,p])); let myList=Object.values(myRaw).map(parsePlayer).map(p=>{p.xgi=Number((p.xg+p.xa).toFixed(2));return p;}).filter(p=>p.name!=='Unknown').sort((a,b)=>b.rating-a.rating); let oppList=Object.values(oppRaw).map(parsePlayer).map(p=>{p.xgi=Number((p.xg+p.xa).toFixed(2));return p;}).filter(p=>p.name!=='Unknown').sort((a,b)=>b.rating-a.rating); return {ts,sf,sa,opp,res,myList,oppList}; }

function buildMerged(){
  const aggMap={}; ALL.forEach(m=>{ m.myList.forEach(p=>{ if(!aggMap[p.name]) aggMap[p.name]={xg:0,xa:0,xgi:0,goals:0,assists:0,pm:0,pa:0,keyPass:0,interceptions:0,clearances:0,blocks:0,tk:0,saves:0,gc:0,games:0,ratingSum:0,ratingCnt:0}; const o=aggMap[p.name]; o.xg+=p.xg; o.xa+=p.xa; o.xgi+=p.xgi; o.goals+=p.goals; o.assists+=p.assists; o.pm+=p.pm; o.pa+=p.pa; o.keyPass+=p.keyPass; o.interceptions+=p.interceptions; o.clearances+=p.clearances; o.blocks+=p.blocks; o.tk+=p.tk; o.saves+=p.saves; o.gc+=p.gc; o.games+=1; if(p.rating){o.ratingSum+=p.rating;o.ratingCnt+=1;} }); });

function renderKPI(){ const w=ALL.filter(m=>m.res==='W').length,d=ALL.filter(m=>m.res==='D').length,l=ALL.filter(m=>m.res==='L').length; const gf=ALL.reduce((s,m)=>s+m.sf,0),ga=ALL.reduce((s,m)=>s+m.sa,0); const xg=ALL.reduce((s,m)=>s+m.myList.reduce((a,p)=>a+p.xg,0),0); const totalDef=ALL.reduce((s,m)=>s+m.myList.reduce((a,p)=>a+p.interceptions+p.clearances+p.tk,0),0); const totalSaves=ALL.reduce((s,m)=>s+m.myList.reduce((a,p)=>a+p.saves,0),0); document.getElementById('kpi').innerHTML=`<div><b>${ALL.length}</b><span style="font-size:10px;display:block">近10場</span></div><div><b>${w}-${d}-${l}</b><span style="font-size:10px;display:block">勝-和-負</span></div><div><b>${gf}-${ga}</b><span style="font-size:10px;display:block">得失球</span></div><div><b>${xg.toFixed(1)}</b><span style="font-size:10px;display:block">xG總和</span></div><div><b>${totalDef}</b><span style="font-size:10px;display:block">總防守</span></div><div><b>${totalSaves}</b><span style="font-size:10px;display:block">總撲救</span></div>`; const mc=document.getElementById('matchesCount'); if(mc){ mc.textContent=`已累計 ${ALL.length} 場 · 總入球 ${gf} · 總防守 ${totalDef}`; } }
function getSortVal(p,k){ if(k==='totalDef') return p.interceptions+p.clearances+p.blocks+p.tk; if(k==='passPct') return p.pa? p.pm/p.pa*100:0; if(k==='passStr') return p.pm; if(k==='rating') return p.rating||0; return Number(p[k]||0); }

function renderMatches(){
  const sortSel=document.getElementById('sortMatches')?.value||'dateDesc';
  if(sortSel==='dateDesc') FIL.sort((a,b)=>b.ts-a.ts);

    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<div class="matchRow" onclick="toggleMatch('${id}')">
      <div><div class="matchOpp">${m.opp} <span class="pill ${m.res}">${m.res}</span></div><div class="matchMeta">${fmt(m.ts)} · xG ${myXG.toFixed(2)}-${oppXG.toFixed(2)} · 防守 ${myDef}-${oppDef} · ${state.key} ${state.dir==='desc'?'▼':'▲'}</div></div><div class="score">${m.sf}-${m.sa}</div></div>
      <div id="${id}" data-detail class="${isOpen?'':'hidden'}">
        <div class="agg"><div><b>${m.myList.reduce((s,p)=>s+p.goals,0)}-${m.oppList.reduce((s,p)=>s+p.goals,0)}</b><span>入球</span></div><div><b>${m.myList.reduce((s,p)=>s+p.assists,0)}-${m.oppList.reduce((s,p)=>s+p.assists,0)}</b><span>助攻</span></div><div><b>${m.myList.reduce((s,p)=>s+p.shotOn,0)}-${m.oppList.reduce((s,p)=>s+p.shotOn,0)}</b><span>中龍</span></div><div><b>${myXG.toFixed(2)}-${oppXG.toFixed(2)}</b><span>xG</span></div><div><b>${(m.myList.reduce((s,p)=>s+p.xa,0)).toFixed(2)}-${(m.oppList.reduce((s,p)=>s+p.xa,0)).toFixed(2)}</b><span>xA</span></div><div><b>${(m.myList.reduce((s,p)=>s+p.xgi,0)).toFixed(2)}-${(m.oppList.reduce((s,p)=>s+p.xgi,0)).toFixed(2)}</b><span>xGI</span></div><div><b>${myDef}-${oppDef}</b><span>總防守</span></div><div><b>${m.myList.reduce((s,p)=>s+p.keyPass,0)}-${m.oppList.reduce((s,p)=>s+p.keyPass,0)}</b><span>威脅傳球</span></div><div><b>${mySave}-${oppSave}</b><span>撲救</span></div></div>
        <div class="segControl" data-match="${idx}">
          <button data-team="my" class="${teamView==='my'?'active':''}" onclick="switchTeam(${idx},'my')">LinKing ${m.myList.length}人</button>
          <button data-team="opp" class="${teamView==='opp'?'active':''}" onclick="switchTeam(${idx},'opp')">${m.opp} ${m.oppList.length}人</button>
          <button data-team="both" class="${teamView==='both'?'active':''}" onclick="switchTeam(${idx},'both')">並排對比</button>
        </div>
        <div class="matchTeamPane ${teamView==='my'?'active':''}" data-match="${idx}" data-pane="my">
          <div class="tableTitle"><span class="teamTag my">LinKing FC</span> 我方</div>
          <div class="tableWrap"><table class="table">${makeHeaders(idx,state.key,state.dir)}${makeRows(mySorted)}</table></div>
        </div>
        <div class="matchTeamPane ${teamView==='opp'?'active':''}" data-match="${idx}" data-pane="opp">
          <div class="tableTitle"><span class="teamTag opp">OPP</span> ${m.opp}</div>
          <div class="tableWrap"><table class="table">${makeHeaders(idx,state.key,state.dir)}${makeRows(oppSorted)}</table></div>
        </div>
        <div class="matchTeamPane ${teamView==='both'?'active':''} bothGrid" data-match="${idx}" data-pane="both">
          <div style="min-width:0"><div class="tableTitle"><span class="teamTag my">LinKing FC</span> 我方</div><div class="tableWrap"><table class="table">${makeHeaders(idx,state.key,state.dir)}${makeRows(mySorted)}</table></div></div>
          <div style="min-width:0"><div class="tableTitle"><span class="teamTag opp">OPP</span> ${m.opp}</div><div class="tableWrap"><table class="table">${makeHeaders(idx,state.key,state.dir)}${makeRows(oppSorted)}</table></div></div>
        </div>
      </div>`;
    wrap.appendChild(div);
  });
}
window.toggleMatch=(id)=>{ const el=document.getElementById(id); if(!el) return; el.classList.toggle('hidden'); if(!el.classList.contains('hidden')) openMatches.add(id); else openMatches.delete(id); };
window.sortMatch=(idx,key)=>{ if(key==='name'||key==='posCN') return; const cur=matchSortState[idx]||{key:'rating',dir:'desc'}; if(cur.key===key) cur.dir=cur.dir==='desc'?'asc':'desc'; else {cur.key=key;cur.dir='desc';} matchSortState[idx]=cur; renderMatches(); };
window.switchTeam=(idx,team)=>{ matchTeamView[idx]=team; const panes=document.querySelectorAll(`[data-match="${idx}"][data-pane]`); panes.forEach(p=>{ p.classList.toggle('active', p.getAttribute('data-pane')===team); }); const btns=document.querySelectorAll(`.segControl[data-match="${idx}"] button`); btns.forEach(b=>{ b.classList.toggle('active', b.getAttribute('data-team')===team); }); };
function renderBoard(){
  const q=document.getElementById('qP')?.value.toLowerCase()||''; const posF=document.getElementById('filterPos')?.value||'all';
  let list=MERGED.filter(p=>{ if(q&&!p.name.toLowerCase().includes(q)) return false; if(posF!=='all'&&p.posCN!==posF) return false; return true; });
  list=list.sort((a,b)=>{ let av=a[sortKey], bv=b[sortKey]; if(typeof av==='string') av=0; if(typeof bv==='string') bv=0; if(sortDir==='desc') return bv-av; else return av-bv; });
  const headers=[ {k:'name',t:'球員',sort:false}, {k:'posCN',t:'位置',sort:false}, {k:'gamesPlayed',t:'場次'}, {k:'goals',t:'入球'}, {k:'assists',t:'助攻'}, {k:'xg',t:'xG'}, {k:'xa',t:'xA'}, {k:'xgi',t:'xGI'}, {k:'ratingAvg',t:'評分'}, {k:'passPct',t:'傳球%'}, {k:'keyPass',t:'威脅傳球'}, {k:'interceptions',t:'攔截'}, {k:'clearances',t:'解圍'}, {k:'tk',t:'剷球'}, {k:'totalDef',t:'總防守'}, {k:'saves',t:'撲救'}, {k:'cleanGK',t:'零封GK'}, {k:'redCards',t:'紅'}, {k:'fouls',t:'犯規'} ];
  let html=`<div class="tableWrap"><table class="table"><tr>${headers.map(h=> h.sort===false? `<th>${h.t}</th>` : `<th data-k="${h.k}" onclick="sortBoard('${h.k}')" class="${sortKey===h.k?'sorted':''}">${h.t}<span class="sort-hint">${sortKey===h.k?(sortDir==='desc'?'▼':'▲'):''}</span></th>`).join('')}</tr>`;
  html+=list.map((p,i)=>`<tr><td><b style="color:#fff">${i+1}. ${p.name}</b></td><td><span class="posTag ${p.posClass}">${p.posCN}</span></td><td>${p.gamesPlayed||'-'}</td><td>${p.goals||'-'}</td><td>${p.assists||'-'}</td><td>${v2(p.xg)}</td><td>${v2(p.xa)}</td><td><b style="color:#fff">${v2(p.xgi)}</b></td><td>${p.ratingAvg? p.ratingAvg.toFixed(2):'-'}</td><td>${p.passPct? p.passPct+'%':'-'}</td><td>${v(p.keyPass)}</td><td>${v(p.interceptions)}</td><td>${v(p.clearances)}</td><td>${v(p.tk)}</td><td><b>${v(p.totalDef)}</b></td><td>${p.saves? `<b style="color:#fde68a">${p.saves}</b>`: '-'}</td><td>${v(p.cleanGK||p.cleanDef)}</td><td>${p.redCards? `<span style="color:#f87171">${p.redCards}</span>`: '-'}</td><td>${v(p.fouls)}</td></tr>`).join(''); html+=`</table></div>`; document.getElementById('board').innerHTML=html;
}
window.sortBoard=(k)=>{ if(sortKey===k){ sortDir=sortDir==='desc'?'asc':'desc'; } else { sortKey=k; sortDir='desc'; } renderBoard(); };
window.nav=(k)=>{ document.getElementById('view-matches').classList.toggle('hidden',k!=='matches'); document.getElementById('view-players').classList.toggle('hidden',k!=='players'); document.getElementById('b-m').classList.toggle('active',k==='matches'); document.getElementById('b-p').classList.toggle('active',k==='players'); };
document.getElementById('qOpp')?.addEventListener('input',e=>{ const q=e.target.value.toLowerCase(); FIL=ALL.filter(m=>!q||m.opp.toLowerCase().includes(q)); renderMatches(); });
document.getElementById('qRes')?.addEventListener('change',e=>{ const v=e.target.value; FIL=v==='all'?ALL.slice():ALL.filter(m=>m.res===v); renderMatches(); });
document.getElementById('sortMatches')?.addEventListener('change',renderMatches);
document.getElementById('qP')?.addEventListener('input',renderBoard);
document.getElementById('filterPos')?.addEventListener('change',renderBoard);
load();
window.addEventListener('resize',()=>{ /* keep both on desktop if user resized */ });
</script>
</body>
</html>
