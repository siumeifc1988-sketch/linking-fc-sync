<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyC3UOT0RyPs6ELCzZOEUXAWn9ysp_-Tw70", authDomain: "football-signup-64bd9.firebaseapp.com", projectId: "football-signup-64bd9", storageBucket: "football-signup-64bd9.firebasestorage.app", messagingSenderId: "133898606488", appId: "1:133898606488:web:fc2f0ce732a26de9157ded" };
const CLUB_ID='41026'; const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let ALL=[],FIL=[],PLAYERS=[]; let sortKey='goals';
function decodeAgg(str){ const m={}; if(!str) return m; str.split(',').forEach(p=>{ const kv=p.split(':'); if(kv.length!=2) return; const k=Number(kv[0]), v=Number(kv[1]); if(!isNaN(k)) m[k]=v; }); return m; }
function posCN(pos){ if(!pos) return '未知'; pos=pos.toLowerCase(); if(pos.includes('goal')) return '門將'; if(pos.includes('def')) return '後衛'; if(pos.includes('mid')) return '中場'; if(pos.includes('for')||pos.includes('striker')||pos.includes('wing')) return '前鋒'; return pos; }
function posClass(pos){ const cn=typeof pos==='string'&&pos.length<=2? pos : posCN(pos); if(cn==='中場') return 'pos-mid'; if(cn==='後衛') return 'pos-def'; if(cn==='前鋒') return 'pos-fwd'; if(cn==='門將') return 'pos-gk'; return 'pos-any'; }
function parsePlayer(p){ const a=decodeAgg(p.match_event_aggregate_0||''); return { name:p.playername||p.name||'Unknown', pos:p.pos||'', posCN:posCN(p.pos), rating:Number(p.rating||0), goals:Number(p.goals||0), assists:Number(p.assists||0), shotAttempts:a[100]||Number(p.shots||0), shotOn:a[101]||0, shotInside:a[106]||0, dribbles:a[212]||0, pm:Number(p.passesmade||0), pa:Number(p.passattempts||0), succPass:a[215]||0, keyPass:a[216]||0, cross:a[182]||0, shortPass:a[174]||0, interceptions:a[24]||0, clearances:a[30]||0, blocks:a[26]||0, headedClear:a[33]||0, duels:a[34]||0, tk:Number(p.tacklesmade||0), tka:Number(p.tackleattempts||0), gc:Number(p.goalsconceded||0), saves:Number(p.saves||0), csgk:Number(p.cleansheetsgk||0), csd:Number(p.cleansheetsdef||0), seconds:Number(p.secondsPlayed||0) }; }
function parseDoc(d){ let ts=Number(d.timestamp||0); if(ts>1e12) ts=Math.floor(ts/1000); let clubs=d.clubs||{}; let my=clubs[CLUB_ID]||Object.values(clubs).find(c=>c.details?.name==='LinKing FC')||{}; let otherKey=Object.keys(clubs).find(k=>k!==CLUB_ID)||''; let other=clubs[otherKey]||{}; let sf=parseInt(my.goals||0,10), sa=parseInt(my.goalsAgainst||0,10); let opp=other.details?.name||'對手'; let res=sf>sa?'W':sf<sa?'L':'D'; let myRaw=(d.players||{})[CLUB_ID]||{}; let oppRaw=(d.players||{})[otherKey]||{}; let myList=Object.values(myRaw).map(parsePlayer).sort((a,b)=>b.rating-a.rating); let oppList=Object.values(oppRaw).map(parsePlayer).sort((a,b)=>b.rating-a.rating); return {id:String(d.matchId||''), ts, sf, sa, opp, res, myList, oppList}; }
function fmt(ts){ const d=new Date(ts*1000); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
async function load(){
  const st=document.getElementById('st');
  try{
    st.textContent='連接 Firebase 中...';
    const q=query(collection(db,'matches'), orderBy('timestamp','desc'), limit(10));
    const snap=await Promise.race([getDocs(q), new Promise((_,rej)=>setTimeout(()=>rej(new Error('連接超時 10秒 - 檢查 Firestore Rules 是否 allow read')),10000))]);
    if(snap.empty) throw new Error('matches 集合為空或無權限');
    let arr=[]; snap.forEach(doc=>{ arr.push(parseDoc(doc.data())); });
    ALL=arr.filter(x=>x.ts>0).sort((a,b)=>b.ts-a.ts); FIL=ALL.slice();
    st.textContent=`已載入 ${ALL.length}場`; renderKPI(); renderMatches();
    const q2=query(collection(db,'matches'), orderBy('timestamp','desc'), limit(120));
    const snap2=await getDocs(q2); let arr2=[]; snap2.forEach(doc=>{ arr2.push(parseDoc(doc.data())); });
    aggPlayers(arr2); showBoard('goals'); st.textContent+=` · 累計 ${arr2.length}場`;
  }catch(err){ console.error(err); st.innerHTML=`<span style="color:#f87171">❌ ${err.message}</span>`;
    const demo=[{id:'1',ts:Date.now()/1000,sf:3,sa:1,opp:'Demo FC',res:'W',myList:[{name:'Ryan Yip',posCN:'中場',goals:2,assists:1,shotOn:3,pm:45,pa:50,keyPass:4,interceptions:2,clearances:1,tk:3,tka:4,saves:0,rating:8.5},{name:'Andy',posCN:'後衛',goals:0,assists:1,shotOn:0,pm:30,pa:32,keyPass:1,interceptions:5,clearances:6,tk:2,tka:2,saves:0,rating:7.2}],oppList:[{name:'Opp Striker',posCN:'前鋒',goals:1,assists:0,shotOn:2,pm:10,pa:15,keyPass:0,interceptions:0,clearances:0,tk:0,tka:0,saves:0,rating:6.8}]}];
    ALL=demo; FIL=demo; renderKPI(); renderMatches(); aggPlayers(demo);
  }
}
function renderKPI(){ const w=ALL.filter(m=>m.res==='W').length,d=ALL.filter(m=>m.res==='D').length,l=ALL.filter(m=>m.res==='L').length; const gf=ALL.reduce((s,m)=>s+m.sf,0),ga=ALL.reduce((s,m)=>s+m.sa,0); document.getElementById('kpi').innerHTML=`<div><b>${w}</b>勝</div><div><b>${d}</b>和</div><div><b>${l}</b>負</div><div><b>${gf}-${ga}</b>得失</div>`; document.getElementById('extra').textContent=`近10場場均 ${ALL.length? (gf/ALL.length).toFixed(1):0}入球 · 含雙方球員`; }
function renderMatches(){ const wrap=document.getElementById('mlist'); wrap.innerHTML=''; FIL.forEach(m=>{ const div=document.createElement('div'); div.className='card'; div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px;color:#fff">${m.opp}</b><div class="mono">${fmt(m.ts)}</div></div><div class="score">${m.sf} - ${m.sa} <span class="pill ${m.res}">${m.res}</span></div></div><div class="cat"><div class="cat-head"><span class="teamTag my">我隊 LinKing</span> 基本雙方球員比賽資料</div>${m.myList.map(p=>`<div class="line"><b style="color:#fff">${p.name}</b> <span class="posTag ${posClass(p.pos)}">${p.posCN}</span> 入${p.goals} 助${p.assists} · 射正${p.shotOn} · 傳${p.pm}/${p.pa} 關鍵${p.keyPass} · 攔${p.interceptions} 解${p.clearances} 剷${p.tk}/${p.tka||0} · 撲${p.saves||0} 評${p.rating.toFixed(1)}</div>`).join('')}</div><div class="cat"><div class="cat-head"><span class="teamTag opp">對手 ${m.opp}</span></div>${m.oppList.map(p=>`<div class="line"><b style="color:#fff">${p.name}</b> <span class="posTag ${posClass(p.pos)}">${p.posCN}</span> 入${p.goals} 助${p.assists} · 射正${p.shotOn} · 傳${p.pm}/${p.pa} · 攔${p.interceptions} · 撲${p.saves||0} 評${p.rating.toFixed(1)}</div>`).join('')||'<div class="mono">無對手詳細</div>'}</div><button class="btn" onclick="this.nextElementSibling.classList.toggle('hidden')">展開雙方詳細數據表</button><div class="hidden"><div style="margin-top:10px"><b style="color:#fff">我隊詳細</b><table class="table"><tr><th>球員</th><th>位置</th><th>入球</th><th>助攻</th><th>射正</th><th>傳球</th><th>關鍵</th><th>攔截</th><th>解圍</th><th>剷球</th><th>撲救</th><th>評分</th></tr>${m.myList.map(p=>`<tr><td><b>${p.name}</b></td><td><span class="posTag ${posClass(p.pos)}">${p.posCN}</span></td><td>${p.goals}</td><td>${p.assists}</td><td>${p.shotOn}</td><td>${p.pm}/${p.pa}</td><td>${p.keyPass}</td><td>${p.interceptions}</td><td>${p.clearances}</td><td>${p.tk}/${p.tka||0}</td><td>${p.saves||0}</td><td>${p.rating.toFixed(1)}</td></tr>`).join('')}</table></div><div style="margin-top:10px"><b style="color:#fff">對手詳細</b><table class="table"><tr><th>球員</th><th>位置</th><th>入球</th><th>射正</th><th>傳球</th><th>攔截</th><th>撲救</th><th>評分</th></tr>${m.oppList.map(p=>`<tr><td><b>${p.name}</b></td><td><span class="posTag ${posClass(p.pos)}">${p.posCN}</span></td><td>${p.goals}</td><td>${p.shotOn}</td><td>${p.pm}/${p.pa}</td><td>${p.interceptions}</td><td>${p.saves||0}</td><td>${p.rating.toFixed(1)}</td></tr>`).join('')}</table></div></div>`; wrap.appendChild(div); }); }
function aggPlayers(arr){ const map={}; arr.forEach(m=>{ m.myList.forEach(p=>{ if(!map[p.name]) map[p.name]={name:p.name,games:0,rating:0,goals:0,assists:0,shotOn:0,shotAttempts:0,dribbles:0,shotInside:0,pm:0,pa:0,succPass:0,keyPass:0,cross:0,shortPass:0,interceptions:0,clearances:0,blocks:0,headedClear:0,tk:0,tka:0,saves:0,gc:0,csgk:0,csd:0,minutes:0,positions:{}}; const o=map[p.name]; o.games++; o.rating+=p.rating; o.goals+=p.goals; o.assists+=p.assists; o.shotOn+=p.shotOn; o.shotAttempts+=p.shotAttempts; o.shotInside+=p.shotInside; o.dribbles+=p.dribbles; o.pm+=p.pm; o.pa+=p.pa; o.succPass+=p.succPass; o.keyPass+=p.keyPass; o.cross+=p.cross; o.shortPass+=p.shortPass; o.interceptions+=p.interceptions; o.clearances+=p.clearances; o.blocks+=p.blocks; o.headedClear+=p.headedClear; o.tk+=p.tk; o.tka+=p.tka; o.saves+=p.saves; o.gc+=p.gc; o.csgk+=p.csgk; o.csd+=p.csd; o.minutes+=p.seconds; const posKey=p.posCN||'未知'; if(!o.positions[posKey]) o.positions[posKey]={pos:posKey,games:0,goals:0,assists:0,rating:0,shotOn:0,pm:0,keyPass:0,interceptions:0,clearances:0,tk:0,saves:0,gc:0}; const pp=o.positions[posKey]; pp.games++; pp.goals+=p.goals; pp.assists+=p.assists; pp.rating+=p.rating; pp.shotOn+=p.shotOn; pp.pm+=p.pm; pp.keyPass+=p.keyPass; pp.interceptions+=p.interceptions; pp.clearances+=p.clearances; pp.tk+=p.tk; pp.saves+=p.saves; pp.gc+=p.gc; }); }); PLAYERS=Object.values(map).map(p=>({...p, rating:p.games? p.rating/p.games:0, minutes:Math.round(p.minutes/60), positions:Object.values(p.positions).map(x=>({...x, rating:x.games? x.rating/x.games:0}))})).sort((a,b)=>b.goals-a.goals); renderPlayers(); }
function renderPlayers(){ const q=document.getElementById('qP').value.toLowerCase(); let list=PLAYERS.filter(p=>!q||p.name.toLowerCase().includes(q)); if(sortKey==='goals') list=list.sort((a,b)=>b.goals-a.goals); if(sortKey==='rating') list=list.sort((a,b)=>b.rating-a.rating); if(sortKey==='games') list=list.sort((a,b)=>b.games-a.games); document.getElementById('plist').innerHTML=list.map((p,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b style="color:#fff">${i+1}. ${p.name}</b><span class="mono">${p.games}場 · ${p.minutes}分鐘 · 平均${p.rating.toFixed(2)}分</span></div><div class="cat"><div class="cat-head">⚽ 進攻累計</div><div class="subgrid"><div class="sub"><div class="t">入球 / 助攻</div><div class="v">${p.goals} / ${p.assists}</div></div><div class="sub"><div class="t">射正 / 射門</div><div class="v">${p.shotOn} / ${p.shotAttempts}</div></div><div class="sub"><div class="t">禁區內 / 扭過人</div><div class="v">${p.shotInside} / ${p.dribbles}</div></div><div class="sub"><div class="t">場均入球</div><div class="v">${(p.goals/p.games).toFixed(2)}</div></div></div></div><div class="cat"><div class="cat-head">🎯 傳球累計</div><div class="subgrid"><div class="sub"><div class="t">傳球 成功/嘗試</div><div class="v">${p.pm} / ${p.pa}</div></div><div class="sub"><div class="t">成功率</div><div class="v">${p.pa? Math.round(p.pm/p.pa*100):0}%</div></div><div class="sub"><div class="t">關鍵 / 傳中</div><div class="v">${p.keyPass} / ${p.cross}</div></div><div class="sub"><div class="t">短傳</div><div class="v">${p.shortPass}</div></div></div></div><div class="cat"><div class="cat-head">🛡️ 防守累計</div><div class="subgrid"><div class="sub"><div class="t">攔截 / 解圍</div><div class="v">${p.interceptions} / ${p.clearances}</div></div><div class="sub"><div class="t">頭槌解圍 / 封堵</div><div class="v">${p.headedClear} / ${p.blocks}</div></div><div class="sub"><div class="t">剷球 成功/嘗試</div><div class="v">${p.tk} / ${p.tka}</div></div><div class="sub"><div class="t">剷球成功率</div><div class="v">${p.tka? Math.round(p.tk/p.tka*100):0}%</div></div></div></div><div class="cat"><div class="cat-head">🧤 門將累計</div><div class="subgrid"><div class="sub"><div class="t">撲救 / 失球</div><div class="v">${p.saves} / ${p.gc}</div></div><div class="sub"><div class="t">零封</div><div class="v">${p.csgk+p.csd}</div></div></div></div><div class="cat"><div class="cat-head">📍 各位置詳細表現</div><table class="table"><tr><th>位置</th><th>場次</th><th>入球</th><th>助攻</th><th>射正</th><th>傳球</th><th>關鍵</th><th>攔截</th><th>解圍</th><th>剷球</th><th>撲救</th><th>平均評分</th></tr>${p.positions.sort((a,b)=>b.games-a.games).map(pp=>`<tr><td><span class="posTag ${posClass(pp.pos)}">${pp.pos}</span></td><td>${pp.games}</td><td>${pp.goals}</td><td>${pp.assists}</td><td>${pp.shotOn}</td><td>${pp.pm}</td><td>${pp.keyPass}</td><td>${pp.interceptions}</td><td>${pp.clearances}</td><td>${pp.tk}</td><td>${pp.saves}</td><td>${pp.rating.toFixed(2)}</td></tr>`).join('')}</table><div class="mono" style="margin-top:6px">最常打位置：<b style="color:#fff">${p.positions.sort((a,b)=>b.games-a.games)[0]?.pos||'未知'}</b> · 打過 ${p.positions.length} 個位置 · ${p.positions.map(pp=>`${pp.pos}${pp.games}場`).join(' / ')}</div></div></div>`).join(''); }
window.showBoard=(type)=>{ document.querySelectorAll('.tabs button').forEach(b=>{ const map={goals:'入球',assists:'助攻',rating:'評分',pass:'傳球',def:'防守',gk:'門將',pos:'位置',code:'Code'}; b.classList.toggle('active', b.textContent.includes(map[type])); }); let sorted=[...PLAYERS]; let html=''; if(type==='goals'){ sorted=sorted.sort((a,b)=>b.goals-a.goals); html='<tr><th>#</th><th>球員</th><th>入球</th><th>助攻</th><th>場次</th><th>場均</th><th>常打位置</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.goals}</td><td>${p.assists}</td><td>${p.games}</td><td>${(p.goals/p.games).toFixed(2)}</td><td><span class="posTag ${posClass(p.positions[0]?.pos)}">${p.positions.sort((a,b)=>b.games-a.games)[0]?.pos||''}</span></td></tr>`).join(''); }else if(type==='assists'){ sorted=sorted.sort((a,b)=>b.assists-a.assists); html='<tr><th>#</th><th>球員</th><th>助攻</th><th>入球+助攻</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.assists}</td><td>${p.goals+p.assists}</td></tr>`).join(''); }else if(type==='rating'){ sorted=sorted.sort((a,b)=>b.rating-a.rating); html='<tr><th>#</th><th>球員</th><th>平均評分</th><th>場次</th><th>常打位置</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.rating.toFixed(2)}</td><td>${p.games}</td><td><span class="posTag ${posClass(p.positions[0]?.pos)}">${p.positions.sort((a,b)=>b.games-a.games)[0]?.pos||''}</span></td></tr>`).join(''); }else if(type==='pass'){ sorted=sorted.sort((a,b)=>b.pm-a.pm); html='<tr><th>#</th><th>球員</th><th>傳球成功</th><th>嘗試</th><th>成功率</th><th>關鍵</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.pm}</td><td>${p.pa}</td><td>${p.pa?Math.round(p.pm/p.pa*100):0}%</td><td>${p.keyPass}</td></tr>`).join(''); }else if(type==='def'){ sorted=sorted.sort((a,b)=>(b.interceptions+b.clearances+b.blocks+b.tk)-(a.interceptions+a.clearances+a.blocks+a.tk)); html='<tr><th>#</th><th>球員</th><th>攔截</th><th>解圍</th><th>封堵</th><th>剷球</th><th>總防守</th><th>常打位置</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.interceptions}</td><td>${p.clearances}</td><td>${p.blocks}</td><td>${p.tk}</td><td>${p.interceptions+p.clearances+p.blocks+p.tk}</td><td><span class="posTag ${posClass(p.positions[0]?.pos)}">${p.positions.sort((a,b)=>b.games-a.games)[0]?.pos||''}</span></td></tr>`).join(''); }else if(type==='gk'){ sorted=sorted.filter(p=>p.saves>0).sort((a,b)=>b.saves-a.saves); html='<tr><th>#</th><th>球員</th><th>撲救</th><th>失球</th><th>零封</th><th>場均失球</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.saves}</td><td>${p.gc}</td><td>${p.csgk}</td><td>${(p.gc/p.games).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=6 class="mono">暫無門將數據</td></tr>'; }else if(type==='pos'){ const posMap={}; PLAYERS.forEach(p=>{ p.positions.forEach(pp=>{ if(!posMap[pp.pos]) posMap[pp.pos]=[]; posMap[pp.pos].push({name:p.name, ...pp}); }); }); html=Object.keys(posMap).map(posKey=>{ const list=posMap[posKey].sort((a,b)=>b.rating-a.rating).slice(0,5); return `<tr><th colspan=7 style="background:#1a1a1a;text-align:left"><span class="posTag ${posClass(posKey)}">${posKey}</span> 位置最佳表現</th></tr><tr><th>#</th><th>球員</th><th>場次</th><th>入球</th><th>評分</th><th>關鍵數據</th><th>失球/撲救</th></tr>`+list.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.games}</td><td>${p.goals}</td><td>${p.rating.toFixed(2)}</td><td>${posKey==='門將'?`撲救${p.saves}`:posKey==='後衛'?`攔截${p.interceptions} 解圍${p.clearances}`:posKey==='中場'?`傳球${p.pm} 關鍵${p.keyPass}`:`射正${p.shotOn}`}</td><td>${p.gc?`失${p.gc}`:p.saves?`撲${p.saves}`:''}</td></tr>`).join(''); }).join(''); }else if(type==='code'){ html='<tr><th>說明</th><th>內容</th></tr><tr><td>專案</td><td>LinKing FC 41026</td></tr><tr><td>功能</td><td>近10場雙方 + 球員累計 + 位置表現 + 榜單 + Code Viewer</td></tr><tr><td>主題</td><td>深色風格（同你cap圖一樣）</td></tr>'; document.getElementById('codeCard').classList.remove('hidden'); document.getElementById('codeArea').textContent=document.documentElement.outerHTML.slice(0,12000)+'...'; } if(type!=='code') document.getElementById('codeCard').classList.add('hidden'); document.getElementById('board').innerHTML=`<table class="table">${html}</table>`; }
window.copyCode=()=>{ navigator.clipboard.writeText(document.documentElement.outerHTML); alert('已複製 Code'); }
window.nav=(k)=>{ document.getElementById('view-matches').classList.toggle('hidden',k!=='matches'); document.getElementById('view-players').classList.toggle('hidden',k!=='players'); document.getElementById('view-board').classList.toggle('hidden',k!=='board'); document.getElementById('b-m').classList.toggle('active',k==='matches'); document.getElementById('b-p').classList.toggle('active',k==='players'); document.getElementById('b-d').classList.toggle('active',k==='board'); };
document.getElementById('qOpp').addEventListener('input',e=>{ const q=e.target.value.toLowerCase(); FIL=ALL.filter(m=>!q||m.opp.toLowerCase().includes(q)); renderMatches(); });
document.getElementById('qRes').addEventListener('change',e=>{ const v=e.target.value; FIL=v==='all'?ALL.slice():ALL.filter(m=>m.res===v); renderMatches(); });
document.getElementById('qP').addEventListener('input',renderPlayers);
document.getElementById('qSort').addEventListener('change',e=>{ sortKey=e.target.value; renderPlayers(); });
load();
</script>
