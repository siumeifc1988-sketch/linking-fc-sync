<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto;background:#0a0a0a;color:#e5e5e5;line-height:1.6}
.h{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.h-pill{display:flex;align-items:center;gap:8px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:999px;padding:8px 14px}
.mono{font-family:ui-monospace,monospace;font-size:11px;color:#888}
.card{margin:12px;background:#161616;border:1px solid #262626;border-radius:20px;padding:14px}
.score{font-size:22px;font-weight:900;color:#fff}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #333}
.W{background:#0f1f12;color:#4ade80}.L{background:#1f1010;color:#f87171}.D{background:#1f1c0f;color:#fbbf24}
.table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;white-space:nowrap}
.table th{color:#888;font-size:11px;text-align:left;padding:10px 8px;border-bottom:1px solid #262626;position:sticky;top:0;background:#161616}
.table td{padding:10px 8px;border-bottom:1px solid #1e1e1e;font-size:12px;color:#ccc}
.table tr:hover td{background:#1e1e1e}
.tableWrap{overflow:auto;border:1px solid #262626;border-radius:12px;background:#161616;margin-top:10px}
.hidden{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 20px}
.bottom button{flex:1;background:none;border:0;font-size:11px;color:#666;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bottom button.active{color:#fff;font-weight:800}
.input{height:38px;border:1px solid #2a2a2a;border-radius:999px;padding:0 14px;width:100%;background:#1a1a1a;color:#fff;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{border:1px solid #262626;border-radius:12px;padding:10px;background:#1e1e1e;text-align:center}
.kpi b{font-size:18px;display:block;color:#fff}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{height:34px;border-radius:999px;border:1px solid #2a2a2a;background:#1a1a1a;color:#888;font-size:11px;padding:0 12px;cursor:pointer}
.tabs button.active{background:#fff;color:#000;font-weight:800}
.teamTag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:6px}
.my{background:#fff;color:#000}.opp{background:#2a2a2a;color:#aaa}
.posTag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.pos-mid{background:#1e293b;color:#93c5fd}.pos-def{background:#132a1e;color:#86efac}.pos-fwd{background:#2a1515;color:#fca5a5}.pos-gk{background:#2a2415;color:#fde68a}
.matchRow{display:flex;justify-content:space-between;align-items:center;padding:14px 6px;cursor:pointer;transition:background .15s;border-radius:12px}
.matchRow:hover{background:#1e1e1e}
.matchLeft{display:flex;flex-direction:column;gap:4px}
.matchOpp{font-size:16px;font-weight:800;color:#fff}
.matchMeta{font-size:11px;color:#888}
.matchRight{display:flex;align-items:center;gap:10px}
.detailBox{margin-top:12px;border-top:1px solid #222;padding-top:12px}
.teamHead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px 0}
.teamHead b{font-size:14px;color:#fff}
.teamHead span{font-size:11px;color:#888}
.aggGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.aggGrid div{background:#1e1e1e;border:1px solid #262626;border-radius:12px;padding:10px;text-align:center}
.aggGrid b{display:block;color:#fff;font-size:14px}
.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.compareGrid{grid-template-columns:1fr}.aggGrid{grid-template-columns:repeat(3,1fr)}}
.playerLine{padding:12px 4px;border-bottom:1px solid #1e1e1e;display:flex;flex-direction:column;gap:4px}
.playerLine .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.playerLine .name{font-weight:800;color:#fff;font-size:14px}
.playerLine .stats{font-size:12px;color:#aaa;line-height:1.5}
.playerLine .stats b{color:#ccc;font-weight:600}
.mobileOnly{display:none}
.desktopOnly{display:block}
@media(max-width:768px){.mobileOnly{display:block}.desktopOnly{display:none}}
.playerCard3{border:1px solid #262626;background:#1a1a1a;border-radius:16px;padding:12px;margin-bottom:12px}
.playerCard3 .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.playerCard3 .head .n{font-weight:800;color:#fff}
.three{display:grid;grid-template-columns:56px 1fr;gap:6px;margin:6px 0}
.three .lbl{font-size:10px;color:#888;padding:6px 0}
.three .val{font-size:11px;background:#111;border:1px solid #222;border-radius:8px;padding:6px 8px;display:flex;gap:10px;flex-wrap:wrap}
.posTable{margin-top:8px}
</style>
</head>
<body>
<div class="h"><div class="h-pill"><span>≡</span><b style="color:#fff">FC 戰績網 方法三</b><span class="mono">響應式對比</span></div><span class="mono" id="st">載入中...</span></div>
<div class="card"><div style="display:flex;justify-content:space-between"><div><b style="font-size:18px;color:#fff">LinKing FC 41026</b> <span class="teamTag my">RANK</span><span class="teamTag opp">PLAYER</span></div></div><div class="kpi" id="kpi" style="margin-top:12px"></div><div class="mono" id="extra" style="margin-top:8px"></div></div>
<div id="view-matches"><div class="card"><div style="display:flex;gap:8px"><input id="qOpp" class="input" placeholder="搜對手"><select id="qRes" class="input" style="max-width:90px"><option value="all">全部</option><option value="W">勝</option><option value="L">負</option><option value="D">和</option></select></div><div class="mono" style="margin-top:8px">方法三：近10場 + aggregate做/RANK · 我隊對手同一欄位，手機電腦都方便對比</div></div><div id="mlist"></div><div style="height:130px"></div></div>
<div id="view-players" class="hidden">
<div class="card"><b style="color:#fff">球員 同一頁三合一 (方法三)</b><div class="mono">今季 members/stats + 生涯 career/stats + 累計(近10場) 同一頁三種排版，預設卡片三行，手機電腦都睇到</div>
<div class="tabs" style="margin-top:10px"><button class="active" onclick="switchLayout('C')">方案C 卡片三行(推薦)</button><button onclick="switchLayout('A')">方案A 分段堆疊</button><button onclick="switchLayout('B')">方案B 寬表對比</button></div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="qP" class="input" placeholder="搜球員"><select id="qSort" class="input" style="max-width:110px"><option value="goals">入球</option><option value="rating">評分</option><option value="games">場次</option></select></div>
</div>
<div id="player-layout-C"></div>
<div id="player-layout-A" class="hidden"></div>
<div id="player-layout-B" class="hidden"></div>
<div style="height:130px"></div>
</div>
<div id="view-board" class="hidden"><div class="card"><div class="tabs"><button class="active" onclick="showBoard('goals')">入球榜</button><button onclick="showBoard('assists')">助攻榜</button><button onclick="showBoard('rating')">評分榜</button><button onclick="showBoard('pos')">位置榜</button><button onclick="showBoard('rank')">/RANK榜</button></div><div id="board"></div></div><div style="height:130px"></div></div>
<div class="bottom"><button id="b-m" class="active" onclick="nav('matches')"><span style="font-size:18px">⚽</span>近10場/RANK</button><button id="b-p" onclick="nav('players')"><span style="font-size:18px">👥</span>球員/PLAYER</button><button id="b-d" onclick="nav('board')"><span style="font-size:18px">📊</span>榜單</button></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyC3UOT0RyPs6ELCzZOEUXAWn9ysp_-Tw70",authDomain:"football-signup-64bd9.firebaseapp.com",databaseURL:"https://football-signup-64bd9-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"football-signup-64bd9",storageBucket:"football-signup-64bd9.firebasestorage.app",messagingSenderId:"133898606488",appId:"1:133898606488:web:fc2f0ce732a26de9157ded"};
const CLUB_ID='41026'; const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let ALL=[],FIL=[],PLAYERS=[],SEASON=[],CAREER=[]; let sortKey='goals'; let layout='C';
function decodeAgg(str){const m={}; if(!str) return m; str.split(',').forEach(p=>{const kv=p.split(':'); if(kv.length!=2) return; const k=Number(kv[0]),v=Number(kv[1]); if(!isNaN(k)) m[k]=v;}); return m;}
function posCN(pos){ if(!pos) return '未知'; pos=String(pos).toLowerCase(); if(pos.includes('goal')) return '門將'; if(pos.includes('def')) return '後衛'; if(pos.includes('mid')) return '中場'; if(pos.includes('for')||pos.includes('striker')||pos.includes('wing')||pos.includes('forward')) return '前鋒'; return pos; }
function posClass(pos){ const cn=posCN(pos); if(cn==='中場') return 'pos-mid'; if(cn==='後衛') return 'pos-def'; if(cn==='前鋒') return 'pos-fwd'; if(cn==='門將') return 'pos-gk'; return 'pos-mid'; }
function parsePlayer(p){ const a=decodeAgg(p.match_event_aggregate_0||''); return {name:p.playername||'Unknown',pos:p.pos||'',posCN:posCN(p.pos||''),rating:Number(p.rating||0),goals:Number(p.goals||0),assists:Number(p.assists||0),shotOn:a[101]||0,shotTot:a[100]||0,pm:Number(p.passesmade||0),pa:Number(p.passattempts||0),keyPass:a[216]||0,interceptions:a[24]||0,clearances:a[30]||0,tk:Number(p.tacklesmade||0),tka:Number(p.tackleattempts||0),saves:Number(p.saves||0),gc:Number(p.goalsconceded||0)}; }
function parseDoc(d){ let ts=Number(d.timestamp||0); if(ts>1e12) ts=Math.floor(ts/1000); let clubs=d.clubs||{}; let my=clubs[CLUB_ID]||Object.values(clubs).find(c=>c.details?.name==='LinKing FC')||{}; let otherKey=Object.keys(clubs).find(k=>k!==CLUB_ID)||''; let other=clubs[otherKey]||{}; let sf=parseInt(my.goals||0),sa=parseInt(my.goalsAgainst||0); let opp=other.details?.name||'對手'; let res=sf>sa?'W':sf<sa?'L':'D'; let players=d.players||{}; let myRaw=players[CLUB_ID]||{}; let oppRaw=players[otherKey]||{}; if(Array.isArray(myRaw)) myRaw=Object.fromEntries(myRaw.map((p,i)=>[p.playerId||i,p])); if(Array.isArray(oppRaw)) oppRaw=Object.fromEntries(oppRaw.map((p,i)=>[p.playerId||i,p])); let myList=Object.values(myRaw).map(parsePlayer).filter(p=>p.name!=='Unknown').sort((a,b)=>b.rating-a.rating); let oppList=Object.values(oppRaw).map(parsePlayer).filter(p=>p.name!=='Unknown').sort((a,b)=>b.rating-a.rating); let agg=(d.aggregate||{})[CLUB_ID]||{}; let aggOpp=(d.aggregate||{})[otherKey]||{}; let a=decodeAgg(agg.match_event_aggregate_0||''); let aOpp=decodeAgg(aggOpp.match_event_aggregate_0||''); return {id:String(d.matchId||''),ts,sf,sa,opp,res,myList,oppList,agg,a,aggOpp,aOpp}; }
function fmt(ts){const d=new Date(ts*1000); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
async function load(){ const st=document.getElementById('st'); try{ st.textContent='連接 Firebase...'; let snap=null; try{ const q=query(collection(db,'clubs','41026','matches'), orderBy('timestamp','desc'), limit(10)); snap=await getDocs(q); if(snap.empty) throw new Error('空'); }catch(e){ const q=query(collection(db,'matches'), orderBy('timestamp','desc'), limit(10)); snap=await getDocs(q); } if(!snap||snap.empty) throw new Error('無對賽'); let arr=[]; snap.forEach(doc=>arr.push(parseDoc(doc.data()))); ALL=arr.filter(x=>x.ts>0).sort((a,b)=>b.ts-a.ts); FIL=ALL.slice(); st.textContent=`已載入 ${ALL.length}場`; renderKPI(); renderMatches(); let snap2=null; try{ const q2=query(collection(db,'clubs','41026','matches'), orderBy('timestamp','desc'), limit(120)); snap2=await getDocs(q2); }catch(e){ const q2=query(collection(db,'matches'), orderBy('timestamp','desc'), limit(120)); snap2=await getDocs(q2); } let arr2=[]; snap2.forEach(doc=>arr2.push(parseDoc(doc.data()))); aggPlayers(arr2); await loadMembers(); }catch(err){ console.error(err); st.textContent='❌ '+err.message; } }
async function loadMembers(){ try{ try{ const q=query(collection(db,'clubs','41026','members'), orderBy('ratingAve','desc')); const snap=await getDocs(q); SEASON=[]; snap.forEach(d=>{ const m=d.data(); SEASON.push({name:m.name||'Unknown',gamesPlayed:parseInt(m.gamesPlayed||0),goals:parseInt(m.goals||0),assists:parseInt(m.assists||0),ratingAve:parseFloat(m.ratingAve||0),passesMade:parseInt(m.passesMade||0),favoritePosition:m.favoritePosition||'',winRate:parseInt(m.winRate||0)}); }); }catch(e){} try{ const q2=query(collection(db,'clubs','41026','members_career'), orderBy('ratingAve','desc')); const snap2=await getDocs(q2); CAREER=[]; snap2.forEach(d=>{ const m=d.data(); CAREER.push({name:m.name||'Unknown',gamesPlayed:parseInt(m.gamesPlayed||0),goals:parseInt(m.goals||0),assists:parseInt(m.assists||0),ratingAve:parseFloat(m.ratingAve||0),passesMade:parseInt(m.passesMade||0),favoritePosition:m.favoritePosition||''}); }); }catch(e){} renderAllLayouts(); }catch(e){ console.error(e); } }
function renderKPI(){ const w=ALL.filter(m=>m.res==='W').length,d=ALL.filter(m=>m.res==='D').length,l=ALL.filter(m=>m.res==='L').length; const gf=ALL.reduce((s,m)=>s+m.sf,0),ga=ALL.reduce((s,m)=>s+m.sa,0); document.getElementById('kpi').innerHTML=`<div><b>${w}</b>勝</div><div><b>${d}</b>和</div><div><b>${l}</b>負</div><div><b>${gf}-${ga}</b>得失</div>`; document.getElementById('extra').textContent=`近10場場均 ${(gf/(ALL.length||1)).toFixed(1)}入球 · aggregate做/RANK · members做/PLAYER`; }
function playerCompact(p){ return `<span class="name">${p.name}</span> <span class="posTag ${posClass(p.pos)}">${p.posCN}</span> <span class="stats">入${p.goals} 助${p.assists} · 射正${p.shotOn} · 傳${p.pm}/${p.pa} 關鍵${p.keyPass} · 攔${p.interceptions} 解${p.clearances} 剷${p.tk}/${p.tka} · 撲${p.saves} 評${p.rating.toFixed(1)}</span>`; }
function renderMatches(){
  const wrap=document.getElementById('mlist'); wrap.innerHTML='';
  FIL.forEach((m,idx)=>{
    const div=document.createElement('div'); div.className='card';
    const detailId='detail-'+idx;
    const myPass=m.a[215]||0, oppPass=m.aOpp[215]||0, myShot=m.a[101]||0, oppShot=m.aOpp[101]||0, myInt=m.a[24]||0, oppInt=m.aOpp[24]||0;
    const mySaves=m.agg.saves||0, oppSaves=m.aggOpp.saves||0;
    div.innerHTML=`
    <div class="matchRow" onclick="toggleDetail('${detailId}')">
      <div class="matchLeft"><div class="matchOpp">${m.opp} <span class="pill ${m.res}">${m.res}</span></div><div class="matchMeta">${fmt(m.ts)} · 我隊${m.myList.length}人 對手${m.oppList.length}人</div></div>
      <div class="matchRight"><div class="score">${m.sf}-${m.sa}</div><div class="matchArrow" id="arrow-${detailId}">›</div></div>
    </div>
    <div id="${detailId}" class="detailBox hidden">
      <div class="aggGrid"><div><b>${myShot} - ${oppShot}</b>射正</div><div><b>${myPass} - ${oppPass}</b>成功傳球</div><div><b>${myInt} - ${oppInt}</b>攔截</div><div><b>${mySaves} - ${oppSaves}</b>撲救</div><div><b>${m.sf} - ${m.sa}</b>比分</div><div><b>${m.myList.length} - ${m.oppList.length}</b>人數</div></div>
      <div class="compareGrid">
        <div>
          <div class="teamHead"><b><span class="teamTag my">我隊</span> LinKing 基本雙方球員比賽資料 (${m.myList.length}人)</b></div>
          <div class="desktopOnly"><div class="tableWrap"><table class="table"><tr><th>球員</th><th>位置</th><th>入球</th><th>助攻</th><th>射正</th><th>傳球</th><th>關鍵</th><th>攔截</th><th>解圍</th><th>剷球</th><th>撲救</th><th>評分</th></tr>${m.myList.map(p=>`<tr><td><b style="color:#fff">${p.name}</b></td><td><span class="posTag ${posClass(p.pos)}">${p.posCN}</span></td><td>${p.goals}</td><td>${p.assists}</td><td>${p.shotOn}</td><td>${p.pm}/${p.pa}</td><td>${p.keyPass}</td><td>${p.interceptions}</td><td>${p.clearances}</td><td>${p.tk}/${p.tka}</td><td>${p.saves}</td><td>${p.rating.toFixed(1)}</td></tr>`).join('')}</table></div></div>
          <div class="mobileOnly">${m.myList.map(p=>`<div class="playerLine">${playerCompact(p)}</div>`).join('')}</div>
        </div>
        <div>
          <div class="teamHead"><b><span class="teamTag opp">對手</span> ${m.opp} (${m.oppList.length}人)</b><span>同一欄位</span></div>
          <div class="desktopOnly"><div class="tableWrap"><table class="table"><tr><th>球員</th><th>位置</th><th>入球</th><th>助攻</th><th>射正</th><th>傳球</th><th>關鍵</th><th>攔截</th><th>解圍</th><th>剷球</th><th>撲救</th><th>評分</th></tr>${m.oppList.length? m.oppList.map(p=>`<tr><td><b style="color:#fff">${p.name}</b></td><td><span class="posTag ${posClass(p.pos)}">${p.posCN}</span></td><td>${p.goals}</td><td>${p.assists}</td><td>${p.shotOn}</td><td>${p.pm}/${p.pa}</td><td>${p.keyPass}</td><td>${p.interceptions}</td><td>${p.clearances}</td><td>${p.tk}/${p.tka}</td><td>${p.saves}</td><td>${p.rating.toFixed(1)}</td></tr>`).join('') : '<tr><td colspan=12 class="mono">無對手詳細 (EA未提供)</td></tr>'}</table></div></div>
          <div class="mobileOnly">${m.oppList.length? m.oppList.map(p=>`<div class="playerLine">${playerCompact(p)}</div>`).join('') : '<div class="mono" style="padding:8px">無對手詳細</div>'}</div>
        </div>
      </div>
    </div>`;
    wrap.appendChild(div);
  });
}
function aggPlayers(arr){ const map={}; arr.forEach(m=>{ m.myList.forEach(p=>{ if(!map[p.name]) map[p.name]={name:p.name,games:0,rating:0,goals:0,assists:0,shotOn:0,pm:0,pa:0,keyPass:0,interceptions:0,clearances:0,tk:0,saves:0,positions:{}}; const o=map[p.name]; o.games++; o.rating+=p.rating; o.goals+=p.goals; o.assists+=p.assists; o.shotOn+=p.shotOn; o.pm+=p.pm; o.pa+=p.pa; o.keyPass+=p.keyPass; o.interceptions+=p.interceptions; o.clearances+=p.clearances; o.tk+=p.tk; o.saves+=p.saves; const posKey=p.posCN||'未知'; if(!o.positions[posKey]) o.positions[posKey]={pos:posKey,games:0,goals:0,assists:0,rating:0,shotOn:0,pm:0,keyPass:0,interceptions:0,clearances:0,tk:0}; const pp=o.positions[posKey]; pp.games++; pp.goals+=p.goals; pp.assists+=p.assists; pp.rating+=p.rating; }); }); PLAYERS=Object.values(map).map(p=>({...p,rating:p.games? p.rating/p.games:0,positions:Object.values(p.positions).map(x=>({...x,rating:x.games? x.rating/x.games:0}))})).sort((a,b)=>b.goals-a.goals); renderAllLayouts(); showBoard('goals'); }
function renderAllLayouts(){
  const q=document.getElementById('qP')?.value.toLowerCase()||''; let list=PLAYERS.filter(p=>!q||p.name.toLowerCase().includes(q)); if(sortKey==='goals') list=list.sort((a,b)=>b.goals-a.goals); if(sortKey==='rating') list=list.sort((a,b)=>b.rating-a.rating); if(sortKey==='games') list=list.sort((a,b)=>b.games-a.games);
  const seasonMap={}; SEASON.forEach(s=>seasonMap[s.name]=s); const careerMap={}; CAREER.forEach(c=>careerMap[c.name]=c);
  // A
  let htmlA=`<div class="card"><b style="color:#fff">方案A - 分段堆疊</b><div class="mono">直向三段：今季表、生涯表、累計卡，手機一頁睇晒</div><div class="tableWrap"><table class="table"><tr><th>球員</th><th>今季</th><th>生涯</th><th>累計</th></tr>${list.slice(0,20).map(p=>{ const s=seasonMap[p.name]; const c=careerMap[p.name]; return `<tr><td><b style="color:#fff">${p.name}</b></td><td>${s? `${s.gamesPlayed}場 ${s.goals}入 ${s.ratingAve.toFixed(1)}分`:'-'}</td><td>${c? `${c.gamesPlayed}場 ${c.goals}入 ${c.ratingAve.toFixed(1)}分`:'-'}</td><td>${p.games}場 ${p.goals}入 ${p.rating.toFixed(2)}分</td></tr>`; }).join('')}</table></div></div>`;
  document.getElementById('player-layout-A').innerHTML=htmlA;
  // B
  let htmlB=`<div class="card"><b style="color:#fff">方案B - 寬表對比</b><div class="mono">電腦版橫向對比，一行睇晒三個來源</div><div class="tableWrap"><table class="table"><tr><th>球員</th><th>今季場次</th><th>生涯場次</th><th>累計場次</th><th>今季入球</th><th>生涯入球</th><th>累計入球</th><th>今季評分</th><th>生涯評分</th><th>累計評分</th></tr>${list.map(p=>{ const s=seasonMap[p.name]||{gamesPlayed:0,goals:0,ratingAve:0}; const c=careerMap[p.name]||{gamesPlayed:0,goals:0,ratingAve:0}; return `<tr><td><b style="color:#fff">${p.name}</b></td><td>${s.gamesPlayed}</td><td>${c.gamesPlayed}</td><td>${p.games}</td><td>${s.goals}</td><td>${c.goals}</td><td>${p.goals}</td><td>${s.ratingAve? s.ratingAve.toFixed(2):'-'}</td><td>${c.ratingAve? c.ratingAve.toFixed(2):'-'}</td><td>${p.rating.toFixed(2)}</td></tr>`; }).join('')}</table></div></div>`;
  document.getElementById('player-layout-B').innerHTML=htmlB;
  // C
  let htmlC=list.map((p,i)=>{ const s=seasonMap[p.name]||{gamesPlayed:0,goals:0,assists:0,ratingAve:0,winRate:0}; const c=careerMap[p.name]||{gamesPlayed:0,goals:0,assists:0,ratingAve:0}; return `<div class="playerCard3"><div class="head"><div class="n">${i+1}. ${p.name} <span class="posTag ${posClass(p.positions[0]?.pos)}">${p.positions.sort((a,b)=>b.games-a.games)[0]?.pos||''}</span></div><div class="mono">${p.games}場 · ${p.positions.length}位置</div></div><div class="three"><div class="lbl">今季</div><div class="val"><span>場次 ${s.gamesPlayed}</span><span>入球 ${s.goals}</span><span>助攻 ${s.assists}</span><span>評分 ${s.ratingAve? s.ratingAve.toFixed(2):'-'}</span><span>${s.winRate? s.winRate+'%勝率':''}</span></div></div><div class="three"><div class="lbl">生涯</div><div class="val"><span>場次 ${c.gamesPlayed}</span><span>入球 ${c.goals}</span><span>助攻 ${c.assists}</span><span>評分 ${c.ratingAve? c.ratingAve.toFixed(2):'-'}</span><span>官方累計</span></div></div><div class="three"><div class="lbl">累計</div><div class="val"><span>場次 ${p.games}</span><span>入球 ${p.goals}</span><span>助攻 ${p.assists}</span><span>評分 ${p.rating.toFixed(2)}</span><span>近10場解出</span></div></div><div class="posTable"><div class="mono">📍 各位置詳細表現 (同一欄位，手機電腦都方便)</div><div class="tableWrap"><table class="table"><tr><th>位置</th><th>場次</th><th>入球</th><th>助攻</th><th>射正</th><th>傳球</th><th>關鍵</th><th>攔截</th><th>解圍</th><th>評分</th></tr>${p.positions.map(pp=>`<tr><td><span class="posTag ${posClass(pp.pos)}">${pp.pos}</span></td><td>${pp.games}</td><td>${pp.goals}</td><td>${pp.assists}</td><td>${pp.shotOn||0}</td><td>${pp.pm||0}</td><td>${pp.keyPass||0}</td><td>${pp.interceptions||0}</td><td>${pp.clearances||0}</td><td>${pp.rating.toFixed(2)}</td></tr>`).join('')}</table></div></div></div>`; }).join('');
  document.getElementById('player-layout-C').innerHTML=htmlC;
}
window.switchLayout=(k)=>{ layout=k; document.getElementById('player-layout-A').classList.toggle('hidden',k!=='A'); document.getElementById('player-layout-B').classList.toggle('hidden',k!=='B'); document.getElementById('player-layout-C').classList.toggle('hidden',k!=='C'); document.querySelectorAll('#view-players .tabs button').forEach((b,i)=>{ const map=['C','A','B']; b.classList.toggle('active', map[i]===k); }); }
window.showBoard=(type)=>{ document.querySelectorAll('#view-board .tabs button').forEach(b=>{ const map={goals:'入球',assists:'助攻',rating:'評分',pos:'位置',rank:'RANK'}; b.classList.toggle('active', b.textContent.includes(map[type])); }); let sorted=[...PLAYERS]; let html=''; if(type==='goals'){ sorted=sorted.sort((a,b)=>b.goals-a.goals); html='<tr><th>#</th><th>球員</th><th>入球</th><th>助攻</th><th>場次</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.goals}</td><td>${p.assists}</td><td>${p.games}</td></tr>`).join(''); } else if(type==='rank'){ const aggRank=[...ALL].sort((a,b)=>(b.a[215]||0)-(a.a[215]||0)).slice(0,10); html='<tr><th>#</th><th>對手</th><th>比分</th><th>傳球成功</th><th>射正</th></tr>'+aggRank.map((m,i)=>`<tr><td>${i+1}</td><td>${m.opp}</td><td>${m.sf}-${m.sa}</td><td>${m.a[215]||0}</td><td>${m.a[101]||0}</td></tr>`).join(''); } else if(type==='assists'){ sorted=sorted.sort((a,b)=>b.assists-a.assists); html='<tr><th>#</th><th>球員</th><th>助攻</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.assists}</td></tr>`).join(''); } else if(type==='rating'){ sorted=sorted.sort((a,b)=>b.rating-a.rating); html='<tr><th>#</th><th>球員</th><th>評分</th></tr>'+sorted.slice(0,15).map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.rating.toFixed(2)}</td></tr>`).join(''); } else if(type==='pos'){ const posMap={}; PLAYERS.forEach(p=>{ p.positions.forEach(pp=>{ if(!posMap[pp.pos]) posMap[pp.pos]=[]; posMap[pp.pos].push({name:p.name, ...pp}); }); }); html=Object.keys(posMap).map(posKey=>{ const list=posMap[posKey].sort((a,b)=>b.rating-a.rating).slice(0,5); return `<tr><th colspan=4 style="background:#1a1a1a;text-align:left"><span class="posTag ${posClass(posKey)}">${posKey}</span></th></tr><tr><th>#</th><th>球員</th><th>場次</th><th>評分</th></tr>`+list.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.games}</td><td>${p.rating.toFixed(2)}</td></tr>`).join(''); }).join(''); } document.getElementById('board').innerHTML=`<div class="tableWrap"><table class="table">${html}</table></div>`; }
window.toggleDetail=(id)=>{ const el=document.getElementById(id); const arrow=document.getElementById('arrow-'+id); el.classList.toggle('hidden'); if(arrow) arrow.textContent=el.classList.contains('hidden')?'›':'⌄'; }
window.nav=(k)=>{ document.getElementById('view-matches').classList.toggle('hidden',k!=='matches'); document.getElementById('view-players').classList.toggle('hidden',k!=='players'); document.getElementById('view-board').classList.toggle('hidden',k!=='board'); document.getElementById('b-m').classList.toggle('active',k==='matches'); document.getElementById('b-p').classList.toggle('active',k==='players'); document.getElementById('b-d').classList.toggle('active',k==='board'); };
document.getElementById('qOpp')?.addEventListener('input',e=>{ const q=e.target.value.toLowerCase(); FIL=ALL.filter(m=>!q||m.opp.toLowerCase().includes(q)); renderMatches(); });
document.getElementById('qRes')?.addEventListener('change',e=>{ const v=e.target.value; FIL=v==='all'?ALL.slice():ALL.filter(m=>m.res===v); renderMatches(); });
document.getElementById('qP')?.addEventListener('input',renderAllLayouts);
document.getElementById('qSort')?.addEventListener('change',e=>{ sortKey=e.target.value; renderAllLayouts(); });
load();
</script>
</body>
