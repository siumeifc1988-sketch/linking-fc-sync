<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinKing FC · Stats</title>
  <meta name="theme-color" content="#360D3A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./detail.css" />
  <style>
    :root {
      --pl-purple: #360D3A;
      --pl-purple-deep: #2a0a2e;
      --pl-magenta: #E90052;
      --pl-violet: #963CFF;
      --pl-green: #00A85A;
      --pl-grey: #767676;
      --bg: #f0eef4;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5668;
      --line: #e2dce8;
      --row-hover: #f7f4fa;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }
    .topbar {
      background: var(--pl-purple);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,.28);
      -webkit-transform: translateZ(0);
    }
    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 6px;
      background: linear-gradient(145deg, var(--pl-magenta) 0%, var(--pl-violet) 100%);
      display: grid; place-items: center;
      font-weight: 800; font-size: 0.78rem; flex: 0 0 auto;
    }
    .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 800; white-space: nowrap; }
    .brand p { margin: 0; font-size: 0.68rem; opacity: 0.7; font-weight: 500; }
    .btn {
      border: 0; background: rgba(255,255,255,.1); color: #fff;
      border-radius: 4px; padding: 0.4rem 0.85rem; font: inherit;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 34px;
    }
    .btn:hover { background: rgba(255,255,255,.18); }
    .accent-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--pl-magenta) 0%, var(--pl-violet) 50%, var(--pl-magenta) 100%);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0.75rem 1rem 2.5rem; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 0;
      border-bottom: 2px solid var(--line);
      margin-bottom: 1.1rem; width: 100%;
    }
    .tabs button {
      border: 0; background: transparent; color: var(--muted);
      border-radius: 0; padding: 0.7rem 1.05rem; font: inherit;
      font-size: 0.86rem; font-weight: 600; cursor: pointer;
      min-height: 42px; border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .tabs button.active {
      color: var(--pl-purple); border-bottom-color: var(--pl-magenta);
    }
    .tabs button:not(.active):hover { color: var(--text); }
    .record-strip {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 0.75rem;
    }
    .record-item {
      padding: 0.7rem 0.35rem; text-align: center;
      border-right: 1px solid var(--line);
    }
    .record-item:last-child { border-right: 0; }
    .record-item .l {
      display: block; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem;
    }
    .record-item .v {
      font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.05; font-variant-numeric: tabular-nums;
    }
    .record-item .v.w { color: var(--pl-green); }
    .record-item .v.l { color: var(--pl-magenta); }
    .record-item .v.gd-pos { color: var(--pl-green); }
    .record-item .v.gd-neg { color: var(--pl-magenta); }
    @media (max-width: 640px) {
      .wrap { padding: 0.65rem 0.65rem 3rem; }
      .record-strip { grid-template-columns: repeat(4, 1fr); }
      .record-item:nth-child(n+5) { border-top: 1px solid var(--line); }
      .tabs button { padding: 0.6rem 0.75rem; font-size: 0.8rem; min-height: 38px; }
      .drawer-head { padding: 0.75rem 0.8rem; }
      #detail, #drawer { scroll-margin-top: 60px; }
    }
    .form-row {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 0.35rem; margin-bottom: 1rem; padding: 0 0.1rem;
    }
    .form-row .label {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.3rem;
    }
    .form-dot {
      width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.65rem; font-weight: 800; color: #fff;
    }
    .form-dot.W { background: var(--pl-green); }
    .form-dot.D { background: #8a8496; }
    .form-dot.L { background: var(--pl-magenta); }
    .panel {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 0.9rem;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line);
      background: #faf8fc;
    }
    .panel-head h2 {
      margin: 0; font-size: 0.9rem; font-weight: 800;
      color: var(--pl-purple); text-transform: uppercase;
    }
    .panel-head .meta { font-size: 0.74rem; color: var(--muted); font-weight: 500; }
    .hint { color: var(--muted); font-size: 0.78rem; margin: 0; padding: 0.65rem 1rem 0; }
    .layout { display: grid; gap: 0.9rem; }
    @media (min-width: 960px) {
      .layout { grid-template-columns: 1.4fr 0.95fr; align-items: start; }
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    thead th {
      background: var(--pl-purple); color: #fff;
      font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0.6rem 0.5rem; text-align: left; white-space: nowrap;
    }
    thead th.n { text-align: right; }
    tbody td { padding: 0.62rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.player-row { cursor: pointer; }
    tbody tr.player-row:hover { background: var(--row-hover); }
    tbody tr.player-row:nth-child(1) td.pos { color: #c9a227; }
    tbody tr.player-row:nth-child(2) td.pos { color: #8a8a8a; }
    tbody tr.player-row:nth-child(3) td.pos { color: #b87333; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    td.pos { width: 2rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
    .who { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(145deg, var(--pl-purple), var(--pl-violet));
      color: #fff; display: grid; place-items: center; font-size: 0.68rem; font-weight: 800;
    }
    .who strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.88rem; }
    .who small { color: var(--muted); font-size: 0.7rem; font-weight: 500; }
    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.4rem; height: 1.25rem; padding: 0 0.35rem;
      border-radius: 3px; font-size: 0.64rem; font-weight: 800; margin-right: 0.35rem; color: #fff;
    }
    .pill.zhW, .pill.W { background: var(--pl-green); }
    .pill.zhD, .pill.D { background: #8a8496; }
    .pill.zhL, .pill.L { background: var(--pl-magenta); }
    #drawer[hidden], #detail[hidden] { display: none !important; }
    .drawer-panel {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); margin-bottom: 0.9rem; overflow: hidden;
      box-shadow: 0 4px 20px rgba(54,13,58,.1);
    }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 0.75rem; padding: 0.9rem 1rem; background: var(--pl-purple); color: #fff;
    }
    .drawer-head h2 { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .drawer-head .sub { margin: 0.2rem 0 0; opacity: 0.75; font-size: 0.78rem; }
    .drawer-head .btn { background: rgba(255,255,255,.12); flex-shrink: 0; border-radius: 4px; }
    .drawer-body { padding: 0.95rem 1rem; }
    .rating-xl { font-size: 2.6rem; font-weight: 800; color: var(--pl-purple); line-height: 1; letter-spacing: -0.04em; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 0.45rem; margin: 0.75rem 0; }
    .mini { background: #f7f4fa; border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.55rem; }
    .mini .l { color: var(--muted); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 0; }
    .mini .v { font-size: 1.25rem; font-weight: 800; margin: 0.12rem 0 0; letter-spacing: -0.02em; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip { border: 1px solid var(--line); background: #f7f4fa; border-radius: 4px; padding: 0.18rem 0.55rem; font-size: 0.74rem; font-weight: 500; }
    .chip strong { font-weight: 800; margin-left: 0.15rem; color: var(--pl-purple); }
    .sec { color: var(--pl-magenta); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin: 0.8rem 0 0.3rem; }
    .err { background: #fff0f5; border: 1px solid #ffc2d4; color: var(--pl-magenta); padding: 0.8rem 1rem; border-radius: var(--radius); margin-bottom: 0.9rem; font-weight: 600; }
    .hide { display: none !important; }
    footer { margin-top: 1.75rem; padding-top: 0.9rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.74rem; }
    footer a { color: var(--pl-purple); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">LK</div>
        <div>
          <h1>LinKing FC</h1>
          <p id="header-sub">Pro Clubs · Stats Centre</p>
        </div>
      </div>
      <button type="button" class="btn" id="btn-reload">重新讀取</button>
    </div>
    <div class="accent-bar"></div>
  </header>

  <div class="wrap">
    <div class="tabs" id="main-tabs" role="tablist">
      <button type="button" data-tab="overview" class="active">總覽</button>
      <button type="button" data-tab="all">全部累計</button>
      <button type="button" data-tab="matches">戰報</button>
    </div>

    <div id="error" class="err hide"></div>

    <section id="view-overview">
      <div class="record-strip" id="ov-record"></div>
      <div class="form-row" id="ov-form"></div>
      <div class="layout">
        <div class="panel">
          <div class="panel-head">
            <h2>球員表現</h2>
            <span class="meta">點欄位排序 · 點列展開明細</span>
          </div>
          <div class="table-wrap">
            <table class="detail-table stats-table">
              <thead id="ov-thead">
                <tr>
                  <th class="pos">#</th>
                  <th>位置</th>
                  <th>球員</th>
                  <th class="n sort" data-sort="rating">評分</th>
                  <th class="n sort" data-sort="games">場</th>
                  <th class="n sort" data-sort="goals">G</th>
                  <th class="n sort" data-sort="assists">A</th>
                  <th class="n sort" data-sort="gA">G+A</th>
                  <th class="n sort" data-sort="shots">射</th>
                  <th class="n sort" data-sort="pass">傳%</th>
                  <th class="n sort" data-sort="keyPass">直塞</th>
                  <th class="n sort" data-sort="interceptions">攔截</th>
                  <th class="n sort" data-sort="tk">搶截</th>
                  <th class="n sort" data-sort="minutes">分</th>
                </tr>
              </thead>
              <tbody id="ov-top"></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>最近比賽</h2>
            <span class="meta">點擊看單場詳情</span>
          </div>
          <div id="ov-matches"></div>
        </div>
      </div>
    </section>

    <section id="view-all" class="hide">
      <div class="record-strip" id="all-record"></div>
      <div class="form-row" id="all-form"></div>
      <div class="panel">
        <div class="panel-head">
          <h2>全部累計球員榜</h2>
          <span class="meta">點欄位排序 · 點列展開明細</span>
        </div>
        <div class="table-wrap">
          <table class="detail-table stats-table">
            <thead id="all-thead">
              <tr>
                <th class="pos">#</th>
                <th>位置</th>
                <th>球員</th>
                <th class="n sort" data-sort="rating">評分</th>
                <th class="n sort" data-sort="games">場</th>
                <th class="n sort" data-sort="goals">G</th>
                <th class="n sort" data-sort="assists">A</th>
                <th class="n sort" data-sort="gA">G+A</th>
                <th class="n sort" data-sort="shots">射</th>
                <th class="n sort" data-sort="pass">傳%</th>
                <th class="n sort" data-sort="keyPass">直塞</th>
                <th class="n sort" data-sort="interceptions">攔截</th>
                <th class="n sort" data-sort="tk">搶截</th>
                <th class="n sort" data-sort="minutes">分</th>
              </tr>
            </thead>
            <tbody id="all-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="view-matches" class="hide">
      <div class="panel">
        <div class="panel-head">
          <h2>戰報</h2>
          <span class="meta">點擊展開雙方球員數據</span>
        </div>
        <p class="hint">具名欄位以 EA 為準 · 含對手數據 · 事件解碼依研究文件</p>
        <div id="match-list"></div>
      </div>
    </section>

    <section id="drawer" class="drawer-panel" hidden>
      <div class="drawer-head">
        <div>
          <h2 id="drawer-name">球員</h2>
          <p class="sub" id="drawer-sub"></p>
        </div>
        <button type="button" class="btn" id="btn-close-drawer">關閉</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </section>

    <section id="detail" class="drawer-panel" hidden>
      <div class="drawer-head">
        <div>
          <h2>單場詳情</h2>
          <p class="sub" id="detail-title"></p>
        </div>
        <button type="button" class="btn" id="btn-close-detail">關閉</button>
      </div>
      <div class="drawer-body" id="detail-body"></div>
    </section>

    <footer>
      資料每日合併累積 · event 解碼參考
      <a href="https://github.com/1erkandogan/fc27-clubs-api/blob/main/docs/match-events.md">fc27-clubs-api</a>
      · <a href="https://github.com/siumeifc1988-sketch/linking-fc-sync">GitHub</a>
      · 戰報含雙方球員
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
