<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinKing FC 41026 - 完整版+位置表現</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,system-ui;background:#f8fafc;color:#111827;line-height:1.5}
.h{padding:16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.h b{font-size:18px}.mono{font-size:12px;color:#6b7280}
.card{margin:12px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px}
.score{font-size:22px;font-weight:900}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #e5e7eb}
.W{background:#f0fdf4;color:#15803d}.L{background:#fef2f2;color:#991b1b}.D{background:#fefce8;color:#92400e}
.cat{margin-top:12px;padding-top:10px;border-top:1px solid #f1f5f9}
.cat-head{font-weight:800;font-size:13px;margin-bottom:6px}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sub{border:1px solid #f1f5f9;background:#f8fafc;border-radius:10px;padding:8px 10px}
.sub .t{font-size:11px;color:#6b7280}.sub .v{font-size:13px;font-weight:700}
.line{font-size:13px;padding:4px 0;border-bottom:1px solid #f8fafc}
.btn{width:100%;height:40px;border-radius:12px;border:1px solid #e5e7eb;background:#f9fafb;margin-top:10px;font-size:13px}
.table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.table th{color:#6b7280;font-size:10px;text-align:left;padding:6px 4px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.table td{padding:6px 4px;border-bottom:1px solid #f3f4f6;font-size:11px}
.hidden{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:20}
.bottom button{flex:1;height:56px;border:0;background:none;font-size:13px}.bottom button.active{font-weight:800;background:#f8fafc}
.input{height:40px;border:1px solid #e5e7eb;border-radius:12px;padding:0 12px;width:100%}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi div{text-align:center;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.kpi b{font-size:18px;display:block}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button{height:34px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-size:12px;padding:0 12px}.tabs button.active{background:#111827;color:#fff}
.teamTag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.my{background:#111827;color:#fff}.opp{background:#e5e7eb;color:#111827}
.posTag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-right:4px}
.pos-mid{background:#dbeafe;color:#1e40af}.pos-def{background:#dcfce7;color:#166534}.pos-fwd{background:#fee2e2;color:#991b1b}.pos-gk{background:#fef3c7;color:#92400e}.pos-any{background:#f3f4f6;color:#374151}
</style>
</head>
<body>
<div class="h"><b>LinKing FC 41026</b> <span class="teamTag my">我隊</span><span class="teamTag opp">對手</span><div class="mono" id="st">載入中...</div></div>
<!-- 其餘JS同你檔案一樣，完整版已喺上面個download入面 -->
</body>
</html>
