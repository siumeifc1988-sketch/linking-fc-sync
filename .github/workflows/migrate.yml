name: Firebase -> GitHub Migration V3 FINAL (handles truncated raw)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrate with robust truncated JSON handling
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            export FIREBASE_PROJECT_ID="football-signup-64bd9"
            export FIREBASE_API_KEY="AIzaSyC3UOT0RyPs6ELCzZOEUXAWn9ysp_-Tw70"
          fi

          node <<'NODE'
          import fs from 'fs';
          const PROJECT_ID = process.env.FIREBASE_PROJECT_ID;
          const API_KEY = process.env.FIREBASE_API_KEY;
          const OUTPUT = "data/matches.json";

          function decode(v){
            if(!v) return null;
            if(v.stringValue!==undefined) return v.stringValue;
            if(v.integerValue!==undefined) return Number(v.integerValue);
            if(v.doubleValue!==undefined) return Number(v.doubleValue);
            if(v.mapValue!==undefined){
              const out={}; for(const k in (v.mapValue.fields||{})) out[k]=decode(v.mapValue.fields[k]); return out;
            }
            if(v.arrayValue!==undefined) return (v.arrayValue.values||[]).map(decode);
            return null;
          }
          function toPlain(doc){
            const out={}; const fields=doc.fields||{};
            for(const k in fields) out[k]=decode(fields[k]);
            // 從 doc name 提取 matchId
            const nameParts=doc.name?.split('/')||[]; out._docId=nameParts[nameParts.length-1]||"";
            return out;
          }

          async function fetchAll(){
            let all=[]; let token=""; let page=0;
            while(true){
              page++;
              let url=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/matches?pageSize=300&orderBy=timestamp%20desc&key=${API_KEY}`;
              if(token) url+=`&pageToken=${encodeURIComponent(token)}`;
              console.log(`[Page ${page}]`);
              const r=await fetch(url);
              if(!r.ok){ console.error(`Fail ${r.status} ${(await r.text()).slice(0,500)}`); break; }
              const j=await r.json();
              all=all.concat(j.documents||[]);
              console.log(`  got ${j.documents?.length||0} total ${all.length}`);
              if(!j.nextPageToken) break;
              token=j.nextPageToken;
              if(page>20) break;
            }
            return all;
          }

          const docs=await fetchAll();
          console.log(`\nTotal Firebase docs: ${docs.length}`);
          if(docs.length>0){
            const sample=toPlain(docs[0]);
            console.log("Sample plain keys:", Object.keys(sample));
            console.log("Sample:", JSON.stringify(sample).slice(0,1000));
          }

          const matches=[];
          let okFull=0, okMinimal=0, fail=0;

          for(const d of docs){
            const p=toPlain(d);
            let raw=null;
            let isTruncated=false;

            if(typeof p.raw==='string' && p.raw.length>0){
              try{
                raw=JSON.parse(p.raw);
                okFull++;
              }catch(e){
                // 嘗試修復截斷 JSON: raw 是 slice(0,10000) 可能中間斷開
                isTruncated=true;
                // 嘗試找最後完整 } 前的內容
                try{
                  // 如果是被截斷的 EA match，至少包含 timestamp, clubs 部分可能不完整
                  // 我們用其他欄位建 minimal match
                  raw=null;
                }catch(e2){}
              }
            } else if(p.raw && typeof p.raw==='object'){
              raw=p.raw;
              okFull++;
            }

            if(raw && (raw.clubs || raw.timestamp)){
              matches.push(raw);
            } else {
              // Fallback: 用分散欄位建 minimal match (你 saveMatchesToDB 有存 ourGoals, oppGoals, opponent, result, timestamp)
              if(p.timestamp){
                const minimal={
                  matchId: p._docId || String(p.timestamp),
                  timestamp: Number(p.timestamp)||0,
                  clubs:{
                    "41026":{goals: Number(p.ourGoals||0), goalsAgainst: Number(p.oppGoals||0)},
                    "opponent":{goals: Number(p.oppGoals||0), details:{name: p.opponent||"對手"}}
                  },
                  // 為了兼容 Bot 解析
                  sf: Number(p.ourGoals||0),
                  sa: Number(p.oppGoals||0),
                  opp: p.opponent||"對手",
                  res: p.result|| (Number(p.ourGoals)>Number(p.oppGoals)?"W":Number(p.ourGoals)<Number(p.oppGoals)?"L":"D"),
                  ts: Number(p.timestamp)||0,
                  myList: [], // 玩家數據遺失 (因為 raw 被截斷)，但至少保留比分和對手
                  _isMinimal: true,
                  _truncated: isTruncated
                };
                matches.push(minimal);
                okMinimal++;
              } else {
                fail++;
              }
            }
          }

          console.log(`\nParse result: Full ${okFull}, Minimal ${okMinimal}, Fail ${fail}`);

          let existing=[];
          if(fs.existsSync(OUTPUT)){
            try{ const j=JSON.parse(fs.readFileSync(OUTPUT,'utf8')); existing=Array.isArray(j)?j:[]; console.log(`Existing GitHub: ${existing.length}場`);}catch(e){}
          }

          const map=new Map();
          for(const m of [...existing, ...matches]){
            const id=m.matchId||m.id||m.timestamp||m.ts||m._docId;
            if(!id) continue;
            const key=String(id);
            // 如果已有完整版，不被 minimal 覆蓋
            if(map.has(key)){
              const prev=map.get(key);
              if(prev._isMinimal && !m._isMinimal) map.set(key,m);
            } else {
              map.set(key,m);
            }
          }
          const merged=[...map.values()].sort((a,b)=>(b.timestamp||b.ts||0)-(a.timestamp||a.ts||0));

          console.log(`\nFinal merged: ${merged.length} (existing ${existing.length} + fb full ${okFull} + fb minimal ${okMinimal})`);
          if(merged.length>0){
            console.log(`Range ${new Date((merged[merged.length-1].timestamp||merged[merged.length-1].ts||0)*1000).toISOString()} -> ${new Date((merged[0].timestamp||merged[0].ts||0)*1000).toISOString()}`);
            console.log(`Full data: ${merged.filter(m=>!m._isMinimal).length}場, Minimal (比分): ${merged.filter(m=>m._isMinimal).length}場`);
          }

          fs.mkdirSync("data",{recursive:true});
          fs.writeFileSync(OUTPUT, JSON.stringify(merged,null,2));
          fs.writeFileSync("data/migration_report.json", JSON.stringify({
            total: merged.length,
            existing: existing.length,
            firebaseDocs: docs.length,
            firebaseFull: okFull,
            firebaseMinimal: okMinimal,
            fail,
            migratedAt: new Date().toISOString(),
            note: "Minimal 表示 raw 被 slice(0,10000) 截斷導致 JSON 無效，僅保留比分/對手，玩家數據遺失，之後新比賽會有完整數據"
          },null,2));
          console.log(`✅ Written ${OUTPUT}`);
          NODE

      - name: Commit
        run: |
          git config user.name "pepe-bot-migration"
          git config user.email "migration@linking.fc"
          git add data/matches.json data/migration_report.json
          git diff --staged --quiet || (git commit -m "migrate V3: Firebase 65 docs with truncated raw fix" && git push)
