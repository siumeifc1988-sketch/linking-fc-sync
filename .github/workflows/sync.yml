name: Sync EA Pro Clubs Matches → Firebase
run-name: ${{ github.actor }} run EA sync LinKing FC
on:
  schedule:
    - cron: '*/30 * * * *' # 每30分鐘UTC時間，注意時區！
  workflow_dispatch: # 手動點擊測試

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run fetch script
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python fetch_ea_to_firebase.py
