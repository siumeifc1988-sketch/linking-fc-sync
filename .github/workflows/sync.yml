name: LinKing FC Sync - Full (chrome110 + Firebase 3650)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch EA + Sync Firebase (3650)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET: ${{ secrets.FIREBASE_BUCKET }}
        run: |
          python scripts/fetch_ea_PLUS.py

      - name: Commit data with rebase
        run: |
          git config user.name "linking-fc-bot"
          git config user.email "bot@linking.fc"
          # 關鍵：先拉最新 remote，避免你手動上傳 index.html 同 bot 搶 push
          git pull --rebase origin main || git pull origin main || echo "pull rebase try"
          git add data/matches.json data/players.json data/summary.json data/archive/ || true
          git diff --cached --quiet && echo "無新數據" && exit 0
          COUNT=$(python -c "import json; print(json.load(open('data/matches.json')).get('count',0))" 2>/dev/null || echo "?")
          git commit -m "auto: ${COUNT}場 sync $(date -u +'%Y-%m-%d %H:%M UTC') [chrome110+firebase]"
          # push 重試 3 次
          for i in 1 2 3; do git push && break || { echo "push fail retry $i"; git pull --rebase origin main; sleep 2; }; done

      - name: Deploy note
        run: echo "data 已更新，GitHub Pages 自動部署"
