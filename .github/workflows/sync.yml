name: linking-fc-sync

on:
  schedule:
    - cron: '*/30 * * * *' # 每30分鐘，你而家嗰個太密會撞
  workflow_dispatch:

concurrency:
  group: linking-fc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "linking-fc-bot"
          git config user.email "bot@linking.fc"

      - name: Pull latest (overwrite local data)
        run: |
          # 本地 data 係衍生數據，直接用遠程為準，避免 JSON conflict
          git checkout -- data/ || true
          git pull --rebase origin main || git pull origin main --no-rebase

      - name: Fetch EA and upload Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET: ${{ secrets.FIREBASE_BUCKET }}
        run: |
          python scripts/fetch_ea_PLUS.py

      - name: Commit & Push
        run: |
          git add -A data/ || true
          git diff --cached --quiet && echo "無新數據" && exit 0
          COUNT=$(python -c "import json; print(json.load(open('data/matches.json')).get('count',0))" 2>/dev/null || echo "?")
          git commit -m "auto: ${COUNT}場 sync $(date -u +'%Y-%m-%d %H:%M UTC') [chrome110+firebase+career]"
          for i in 1 2 3; do
            git push && break || {
              echo "push retry $i"
              git pull --rebase origin main
              sleep 2
            }
          done
