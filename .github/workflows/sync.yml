name: sync-fc27
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi --quiet
      - run: python fetch_ea_to_firebase.py
      - run: |
          git config user.name "linking-bot"
          git config user.email "bot@linking.hk"
          git add data/
          git diff --staged --quiet || (git commit -m "auto sync $(date -u)" && git push)