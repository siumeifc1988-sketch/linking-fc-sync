name: LinKing FC Sync - Full (chrome110 + Firebase 3650)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch EA (1st)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET: ${{ secrets.FIREBASE_BUCKET }}
        run: |
          python scripts/fetch_ea_PLUS.py

      - name: Commit with safe rebase
        run: |
          git config user.name "linking-fc-bot"
          git config user.email "bot@linking.fc"
          # 1. 先 stash 你今次生成嘅 data，避免 pull 嗰陣話 unstaged
          git stash push -m "temp-sync-data" --include-untracked --keep-index || true
          # 2. 拉最新 remote (你手動上傳嘅 index.html)
          git pull --rebase origin main || { git rebase --abort || true; git pull origin main --no-rebase || true; }
          # 3. 還原並重跑一次 fetch，確保 merge 咗 remote 舊數據 + EA 新數據
          git stash pop || true
          python scripts/fetch_ea_PLUS.py
          # 4. commit & push 重試
          git add data/matches.json data/players.json data/summary.json data/archive/ || true
          git diff --cached --quiet && echo "無新數據" && exit 0
          COUNT=$(python -c "import json; print(json.load(open('data/matches.json')).get('count',0))" 2>/dev/null || echo "?")
          git commit -m "auto: ${COUNT}場 sync $(date -u +'%Y-%m-%d %H:%M UTC') [chrome110+firebase]"
          for i in 1 2 3; do git push && break || { echo "push retry $i"; git pull --rebase origin main; sleep 2; }; done

      - name: Note
        run: echo "同步完成，同之前幾十次一樣，Firebase 已抄到 matches/ + clubs/41026/matches"
