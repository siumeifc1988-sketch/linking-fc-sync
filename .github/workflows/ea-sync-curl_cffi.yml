name: ea-sync-curl_cffi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync EA data
        env:
          EA_PROXY_URL: ${{ secrets.EA_PROXY_URL }}
        run: python scripts/sync.py

      - name: Commit
        run: |
          git config user.name "pepe-bot"
          git config user.email "pepe-bot@users.noreply.github.com"
          git add data/matches.json data/meta.json data/aggregated/board.json || true
          git diff --cached --quiet && echo "無變化" || (git commit -m "chore: curl_cffi sync $(date +%Y%m%d%H%M) [skip ci]" && git push)
