name: ea-sync-curl_cffi

on:
  workflow_dispatch:
  schedule:
    # 03:00 Asia/Hong_Kong (UTC+8, no DST) = 19:00 UTC
    - cron: "0 19 * * *"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sync EA data (merge into history)
        env:
          EA_PROXY_URL: ${{ secrets.EA_PROXY_URL }}
        run: python scripts/sync.py

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pepe-bot"
          git config user.email "pepe-bot@users.noreply.github.com"
          git add data/matches.json data/meta.json data/aggregated/board.json data/aggregated/board_last10.json || true
          if git diff --cached --quiet; then
            echo "無變化"
          else
            git commit -m "chore: accumulate sync $(date +%Y%m%d%H%M)"
            git push
            # GITHUB_TOKEN pushes do not emit push events, so Deploy Pages
            # would stay idle. workflow_dispatch is the supported exception.
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              gh workflow run deploy-pages.yml --ref main
            fi
          fi
