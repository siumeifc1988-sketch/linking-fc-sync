name: EA Sync - 實用版 10+10+10 標明日期

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - run: |
          cat > /tmp/fetch.py <<'PY'
          import json, os, math, datetime
          from curl_cffi import requests

          CLUB_ID = "41026"
          HEADERS = {"Accept":"application/json","Referer":"https://www.ea.com/","Origin":"https://www.ea.com","User-Agent":"Mozilla/5.0"}

          def fetch(match_type, count=10):
              url=f"https://proclubs.ea.com/api/fc/clubs/matches?platform=common-gen5&clubIds={CLUB_ID}&matchType={match_type}&maxResultCount={count}"
              # 1. 先試 curl_cffi 直連
              try:
                  r=requests.get(url, headers=HEADERS, impersonate="chrome124", timeout=20)
                  if r.status_code==200:
                      data=r.json()
                      lst=data if isinstance(data,list) else data.get(CLUB_ID) or data.get(int(CLUB_ID)) or data.get("matches") or next((v for v in data.values() if isinstance(v,list)), [])
                      print(f"[直連] {match_type} {len(lst)}場 status 200")
                      for m in lst: m["_matchType"]=match_type
                      return lst
                  print(f"[直連] {match_type} 403")
              except Exception as e:
                  print(f"[直連] {match_type} 例外 {e}")

              # 2. 再試 Proxy (如果有設 EA_PROXY_URL secret)
              proxy_base=os.getenv("EA_PROXY_URL","").strip()
              if proxy_base:
                  try:
                      proxy_url = proxy_base + requests.utils.quote(url, safe='')
                      r=requests.get(proxy_url, timeout=20)
                      if r.status_code==200:
                          data=r.json()
                          lst=data if isinstance(data,list) else data.get(CLUB_ID) or data.get(int(CLUB_ID)) or data.get("matches") or next((v for v in data.values() if isinstance(v,list)), [])
                          print(f"[Proxy] {match_type} {len(lst)}場")
                          for m in lst: m["_matchType"]=match_type
                          return lst
                  except Exception as e:
                      print(f"[Proxy] {match_type} 失敗 {e}")
              return []

          def load_existing():
              p="data/matches.json"
              if os.path.exists(p):
                  try:
                      with open(p,'r',encoding='utf-8') as f:
                          arr=json.load(f)
                          return arr if isinstance(arr,list) else []
                  except: return []
              return []

          # 抓
          league=fetch("leagueMatch",10)
          friendly=fetch("friendlyMatch",10)
          playoff=fetch("playoffMatch",10)
          all_latest=league+friendly+playoff
          now_hk = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          now_str = now_hk.strftime("%Y-%m-%d %H:%M HKT")

          existing=load_existing()

          if len(all_latest)==0:
              print(f"⚠️ 今次 EA 0場 (Runner 被封)，保留舊檔 {len(existing)}場，標明日期 {now_str}")
              deduped=existing
              status="保留舊檔"
          else:
              # 去重
              def fp(m):
                  ts=int((m.get("timestamp",0) or 0)//60*60)
                  clubs=m.get("clubs",{})
                  my=clubs.get(CLUB_ID) or next(iter(clubs.values()),{})
                  other=next((k for k in clubs.keys() if k!=CLUB_ID),"")
                  return f"{ts}_{other}_{my.get('goals',0)}-{my.get('goalsAgainst',0)}"
              by={}
              for m in all_latest:
                  f=fp(m)
                  if f not in by or m.get("timestamp",0)>by[f].get("timestamp",0):
                      by[f]=m
              deduped=sorted(by.values(), key=lambda x:x.get("timestamp",0), reverse=True)
              status="已更新"
              print(f"去重後 {len(deduped)}場")

          # 解析成 board
          def safe(n):
              try: v=float(n); return 0 if math.isnan(v) or math.isinf(v) else v
              except: return 0
          def decode(s):
              m={}
              if not s: return m
              for p in s.split(','):
                  kv=p.split(':')
                  if len(kv)!=2: continue
                  try: m[int(kv[0])]=float(kv[1])
                  except: pass
              return m
          def pos_cn(p):
              if not p: return "未知"
              p=str(p).lower()
              if "goal" in p: return "門將"
              if "def" in p: return "後衛"
              if "mid" in p: return "中場"
              if any(x in p for x in ["for","striker","wing","forward"]): return "前鋒"
              return p
          def parse_player(p):
              a=decode(p.get("match_event_aggregate_0") or p.get("aggregate") or "")
              succ=safe(a.get(215,0)); pm=succ or safe(p.get("passesmade") or p.get("passesMade") or 0)
              pa=safe(p.get("passattempts") or p.get("passAttempts") or 0) or (succ+safe(a.get(153,0))) or pm
              shots=safe(p.get("shots") or a.get(100,0)); shot_on=safe(a.get(101,0) or p.get("shotsOn",0))
              inside=safe(a.get(106,0)); outside=safe(a.get(107,0) or max(0,shots-inside))
              xg=shot_on*0.35+max(0,inside-shot_on)*0.12+outside*0.04 if inside>0 else shot_on*0.32+max(0,shots-shot_on)*0.06
              return {"name":p.get("playername") or p.get("name") or "Unknown","posCN":pos_cn(p.get("pos") or p.get("position") or ""),"rating":safe(p.get("rating",0)),"goals":int(safe(p.get("goals",0))),"assists":int(safe(p.get("assists",0))),"xg":round(max(0,xg),2),"xa":round(safe(a.get(216,0))*0.12+safe(p.get("assists",0))*0.15,2),"pm":int(pm),"pa":int(pa),"keyPass":int(safe(a.get(216,0) or 0)),"interceptions":int(safe(a.get(24,0) or 0)),"clearances":int(safe(a.get(30,0))),"blocks":int(safe(a.get(31,0))),"tk":int(safe(p.get("tacklesmade") or p.get("tacklesMade") or a.get(22,0))),"games":1,"ratingSum":safe(p.get("rating",0)),"ratingCnt":1 if safe(p.get("rating",0)) else 0}

          # 建 agg
          from collections import defaultdict
          agg={}
          for d in deduped:
              clubs=d.get("clubs",{}); players=d.get("players",{}); my_raw=players.get(CLUB_ID) or {}
              if isinstance(my_raw,list): my_raw={p.get("playerId",i):p for i,p in enumerate(my_raw)}
              for p_raw in my_raw.values():
                  pp=parse_player(p_raw)
                  if pp["name"]=="Unknown": continue
                  name=pp["name"]
                  if name not in agg:
                      agg[name]={"xg":0,"xa":0,"goals":0,"assists":0,"pm":0,"pa":0,"keyPass":0,"interceptions":0,"clearances":0,"blocks":0,"tk":0,"games":0,"ratingSum":0,"ratingCnt":0,"posCN":pp["posCN"]}
                  o=agg[name]
                  o["xg"]+=pp["xg"]; o["xa"]+=pp["xa"]; o["goals"]+=pp["goals"]; o["assists"]+=pp["assists"]; o["pm"]+=pp["pm"]; o["pa"]+=pp["pa"]; o["keyPass"]+=pp["keyPass"]; o["interceptions"]+=pp["interceptions"]; o["clearances"]+=pp["clearances"]; o["blocks"]+=pp["blocks"]; o["tk"]+=pp["tk"]; o["games"]+=1; o["ratingSum"]+=pp["ratingSum"]; o["ratingCnt"]+=pp["ratingCnt"]

          players=[]
          for name,a in agg.items():
              avg=a["ratingSum"]/a["ratingCnt"] if a["ratingCnt"] else 0
              players.append({"name":name,"posCN":a["posCN"],"games":a["games"],"goals":a["goals"],"assists":a["assists"],"xg":round(a["xg"],2),"xa":round(a["xa"],2),"pm":a["pm"],"pa":a["pa"],"passPct":round(a["pm"]/a["pa"]*100) if a["pa"] else 0,"keyPass":a["keyPass"],"interceptions":a["interceptions"],"clearances":a["clearances"],"blocks":a["blocks"],"tk":a["tk"],"totalDef":a["interceptions"]+a["clearances"]+a["blocks"]+a["tk"],"avgRating":round(avg,2)})
          players.sort(key=lambda x:(x["goals"]+x["assists"]),reverse=True)

          os.makedirs("data/aggregated",exist_ok=True)
          if len(all_latest)>0:
              with open("data/matches.json","w",encoding="utf-8") as f: json.dump(deduped,f,ensure_ascii=False,indent=2)

          # 實用重點：標明日期
          board={
              "players":players,
              "totalMatches":len(deduped),
              "lastUpdated": now_hk.isoformat(),
              "lastUpdatedDisplay": now_str,
              "lastStatus": status,
              "lastFetchCounts":{"league":len(league),"friendly":len(friendly),"playoff":len(playoff)},
              "version":"實用版-日期標明",
              "source":f"{status} {len(deduped)}場 ({now_str}) league{len(league)}+friendly{len(friendly)}+playoff{len(playoff)}"
          }
          meta={
              "totalMatches":len(deduped),
              "lastUpdated": board["lastUpdated"],
              "lastUpdatedDisplay": now_str,
              "lastStatus": status,
              "lastFetchCounts": board["lastFetchCounts"],
              "version":"實用版-日期標明",
              "note":f"{status} - 最新{len(deduped)}場 抓取時間 {now_str}"
          }
          with open("data/aggregated/board.json","w",encoding="utf-8") as f: json.dump(board,f,ensure_ascii=False,indent=2)
          with open("data/meta.json","w",encoding="utf-8") as f: json.dump(meta,f,ensure_ascii=False,indent=2)

          print(f"✅ {status}: 最新{len(deduped)}場 @ {now_str}, {len(players)}人")
          PY
      - name: 執行
        env:
          EA_PROXY_URL: ${{ secrets.EA_PROXY_URL }}
        run: python /tmp/fetch.py
      - name: Commit
        run: |
          git config user.name "pepe-bot"
          git config user.email "pepe-bot@users.noreply.github.com"
          git add data/matches.json data/meta.json data/aggregated/board.json || true
          git diff --cached --quiet && echo "無變化" || (git commit -m "chore: 實用版 ${{ github.run_id }} [skip ci]" && git push)
