name: EA Sync to GitHub - V600 Detailed

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p data/aggregated .github/scripts

      - name: Create detailed sync script
        run: |
          cat > .github/scripts/sync.mjs <<'JS'
          import fs from 'fs';
          const CLUB_ID = process.env.CLUB_ID || '41026';
          const EA_PROXY_URL = process.env.EA_PROXY_URL || '';
          const EA_HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Accept': 'application/json, text/plain, */*',
            'Accept-Language': 'en-US,en;q=0.9',
            'Referer': 'https://www.ea.com/',
            'Origin': 'https://www.ea.com',
            'Cache-Control': 'no-cache'
          };
          async function fetchWithRetry(url){
            if(EA_PROXY_URL){
              try{
                const pu = EA_PROXY_URL.includes('?') ? `${EA_PROXY_URL}${encodeURIComponent(url)}` : `${EA_PROXY_URL}?url=${encodeURIComponent(url)}`;
                const r = await fetch(pu, {headers:EA_HEADERS, signal:AbortSignal.timeout(10000)});
                if(r.ok) return await r.json();
              }catch(e){ console.log('CF Proxy fail', e.message); }
            }
            try{
              const r = await fetch(url, {headers:EA_HEADERS, signal:AbortSignal.timeout(8000)});
              if(r.ok) return await r.json();
            }catch(e){ console.log('Direct fail', e.message); }
            for(const p of [(u)=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, (u)=>`https://corsproxy.io/?${encodeURIComponent(u)}`]){
              try{
                const r = await fetch(p(url), {headers:EA_HEADERS, signal:AbortSignal.timeout(12000)});
                if(!r.ok) continue;
                const txt = await r.text(); if(!txt) continue;
                const j = JSON.parse(txt);
                return j.contents ? JSON.parse(j.contents) : j;
              }catch{}
            }
            throw new Error('All fetch failed');
          }
          async function fetchMatches(type){
            const eaType = type==='league'?'leagueMatch':type==='friendly'?'friendlyMatch':'playoffMatch';
            const url = `https://proclubs.ea.com/api/fc/clubs/matches?platform=common-gen5&clubIds=${CLUB_ID}&matchType=${eaType}&maxResultCount=10`;
            try{
              const data = await fetchWithRetry(url);
              let list = data[CLUB_ID] || data[Number(CLUB_ID)] || data.matches || [];
              if(!Array.isArray(list)) list=[];
              console.log(`EA ${type} -> ${list.length}`);
              return list;
            }catch(e){ console.error(`fetch ${type} fail ${e.message}`); return []; }
          }
          function safe(n){ const v=Number(n); return isNaN(v)||!isFinite(v)?0:v; }
          function decodeAgg(s){const m={}; if(!s) return m; s.split(',').forEach(p=>{const kv=p.split(':'); if(kv.length!=2) return; const k=Number(kv[0]),v=Number(kv[1]); if(!isNaN(k)&&v!=null) m[k]=v;}); return m;}
          function posCN(pos){ if(!pos) return '未知'; pos=String(pos).toLowerCase(); if(pos.includes('goal')) return '門將'; if(pos.includes('def')) return '後衛'; if(pos.includes('mid')) return '中場'; if(pos.includes('for')||pos.includes('striker')||pos.includes('wing')||pos.includes('forward')) return '前鋒'; return pos; }
          function parsePlayerV4(p){
            const a=decodeAgg(p.match_event_aggregate_0||p.aggregate||'');
            const succ=safe(a[215]); const pm=succ||safe(p.passesmade||p.passesMade)||0;
            const pa=safe(p.passattempts||p.passAttempts)||(succ+safe(a[153]))||pm;
            const shots=safe(p.shots||a[100]); const shotOn=safe(a[101]||p.shotsOn);
            const insideBox=safe(a[106]); const outsideBox=safe(a[107]||Math.max(0,shots-insideBox));
            let xg=0; if(insideBox>0){ xg=shotOn*0.35+Math.max(0,insideBox-shotOn)*0.12+outsideBox*0.04; } else { xg=shotOn*0.32+Math.max(0,shots-shotOn)*0.06; }
            return {name:p.playername||p.name||'Unknown', pos:p.pos||p.position||'', posCN:posCN(p.pos||p.position||''), rating:safe(p.rating), goals:safe(p.goals), assists:safe(p.assists), xg:Number(Math.max(0,xg).toFixed(2)), xa:Number((safe(a[216])*0.12+safe(p.assists)*0.15).toFixed(2)), xgi:0, pm, pa, keyPass:safe(a[216]||p.keyPasses), interceptions:safe(a[24]||p.interceptions), clearances:safe(a[30]), blocks:safe(a[31]), tk:safe(p.tacklesmade||p.tacklesMade||a[22]), saves:safe(p.saves||a[14]), gc:safe(a[15])};
          }
          function parseDocV4(d){
            let ts=Number(d.timestamp||0); if(ts>1e12) ts=Math.floor(ts/1000); if(!ts||isNaN(ts)) return null;
            let clubs=d.clubs||{}; let my=clubs[CLUB_ID]||Object.values(clubs).find(c=>c.details?.name?.includes('Double')||c.details?.name?.includes('LinKing'))||{}; let otherKey=Object.keys(clubs).find(k=>k!==CLUB_ID)||''; let other=clubs[otherKey]||{};
            let sf=parseInt(my.goals||0),sa=parseInt(my.goalsAgainst||0); if(isNaN(sf)) sf=0; if(isNaN(sa)) sa=0;
            let opp=other.details?.name||'對手'; let res=sf>sa?'W':sf<sa?'L':'D';
            let players=d.players||{}; let myRaw=players[CLUB_ID]||{};
            if(Array.isArray(myRaw)) myRaw=Object.fromEntries(myRaw.map((p,i)=>[p.playerId||i,p]));
            let myList=Object.values(myRaw).map(parsePlayerV4).map(p=>{p.xgi=Number((p.xg+p.xa).toFixed(2));return p;}).filter(p=>p.name!=='Unknown').sort((a,b)=>b.rating-a.rating);
            return {ts,sf,sa,opp,res,myList, raw:d};
          }
          function loadExisting(){ try{ if(fs.existsSync('data/matches.json')){ const arr=JSON.parse(fs.readFileSync('data/matches.json','utf8')); return Array.isArray(arr)?arr:(arr.matches||[]); } }catch{} return []; }
          function dedup(all){ const m=new Map(); for(const x of all){ const id=x.matchId||x.id||`${x.timestamp}`; if(!id) continue; if(!m.has(id)||(x.timestamp||0)>(m.get(id).timestamp||0)) m.set(id,x); } return [...m.values()].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)); }
          function buildDetailedBoard(parsedMatches){
            const aggMap={};
            parsedMatches.forEach(m=>{ m.myList.forEach(p=>{
              if(!aggMap[p.name]) aggMap[p.name]={xg:0,xa:0,xgi:0,goals:0,assists:0,pm:0,pa:0,keyPass:0,interceptions:0,clearances:0,blocks:0,tk:0,saves:0,gc:0,games:0,ratingSum:0,ratingCnt:0,pos:p.pos,posCN:p.posCN};
              const o=aggMap[p.name]; o.xg+=p.xg||0; o.xa+=p.xa||0; o.xgi+=p.xgi||0; o.goals+=p.goals||0; o.assists+=p.assists||0; o.pm+=p.pm||0; o.pa+=p.pa||0; o.keyPass+=p.keyPass||0; o.interceptions+=p.interceptions||0; o.clearances+=p.clearances||0; o.blocks+=p.blocks||0; o.tk+=p.tk||0; o.saves+=p.saves||0; o.gc+=p.gc||0; o.games+=1; if(p.rating){o.ratingSum+=p.rating;o.ratingCnt+=1;}
            });});
            const players=Object.keys(aggMap).map(name=>{
              const a=aggMap[name]; const avg=a.ratingCnt?(a.ratingSum/a.ratingCnt):0;
              return {name,pos:a.pos,posCN:a.posCN,games:a.games,goals:a.goals,assists:a.assists,xg:Number(a.xg.toFixed(2)),xa:Number(a.xa.toFixed(2)),xgi:Number(a.xgi.toFixed(2)),pm:a.pm,pa:a.pa,passPct:a.pa?Math.round(a.pm/a.pa*100):0,keyPass:a.keyPass,interceptions:a.interceptions,clearances:a.clearances,blocks:a.blocks,tk:a.tk,totalDef:a.interceptions+a.clearances+a.blocks+a.tk,saves:a.saves,gc:a.gc,avgRating:avg?Number(avg.toFixed(2)):0};
            }).sort((a,b)=> (b.goals+b.assists)-(a.goals+a.assists));
            return {players,totalMatches:parsedMatches.length,lastUpdated:new Date().toISOString(),version:'V600-DETAILED'};
          }
          async function main(){
            const [l,f,p]=await Promise.all([fetchMatches('league'),fetchMatches('friendly'),fetchMatches('playoff')]);
            const existingRaw=loadExisting();
            const mergedRaw=dedup([...l,...f,...p,...existingRaw]).slice(0,1000);
            const parsed=[]; for(const d of mergedRaw){ const pd=parseDocV4(d); if(pd) parsed.push(pd); }
            console.log(`parsed ${parsed.length}/${mergedRaw.length}`);
            const board=buildDetailedBoard(parsed);
            const meta={totalMatches:mergedRaw.length,parsedMatches:parsed.length,lastUpdated:new Date().toISOString(),lastMatchId:mergedRaw[0]?.matchId||null,lastFetchCounts:{league:l.length,friendly:f.length,playoff:p.length},version:'V600-DETAILED'};
            fs.mkdirSync('data/aggregated',{recursive:true});
            fs.writeFileSync('data/matches.json',JSON.stringify(mergedRaw,null,2));
            fs.writeFileSync('data/aggregated/board.json',JSON.stringify(board,null,2));
            fs.writeFileSync('data/meta.json',JSON.stringify(meta,null,2));
            console.log(`✅ saved raw ${mergedRaw.length}, players ${board.players.length}`);
          }
          await main();
          JS

      - name: Run sync
        env:
          CLUB_ID: '41026'
          EA_PROXY_URL: ${{ secrets.EA_PROXY_URL }}
        run: node .github/scripts/sync.mjs

      - name: Commit
        run: |
          git config user.name "pepe-bot"
          git config user.email "pepe-bot@users.noreply.github.com"
          git add data/matches.json data/meta.json data/aggregated/board.json || true
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: sync EA detailed $(date -u +%Y-%m-%d) [skip ci]" && git push)
