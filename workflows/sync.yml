name: LinKing FC Sync - Full (curl_cffi + Firebase 3650)

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分鐘
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (curl_cffi 必須)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch PLUS 3650 (curl_cffi chrome124)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET: ${{ secrets.FIREBASE_BUCKET }}
        run: |
          python scripts/fetch_ea_PLUS.py

      - name: BigData summary (fc27-clubs-api 不入data)
        run: |
          python scripts/bigdata.py || echo "bigdata optional"
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "linking-fc-bot"
          git config user.email "bot@linking.fc"
          git add data/matches.json data/players.json data/summary.json data/archive/ || true
          git diff --cached --quiet && echo "無新數據" && exit 0
          COUNT=$(python -c "import json; print(json.load(open('data/matches.json')).get('count',0))" 2>/dev/null || echo "?")
          git commit -m "auto: ${COUNT}場 sync $(date -u +'%Y-%m-%d %H:%M UTC') [curl_cffi]"
          git push

      - name: Deploy to GitHub Pages (if you use gh-pages)
        if: success()
        run: |
          echo "data 已更新，GitHub Pages 會自動部署"
